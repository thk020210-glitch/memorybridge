<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>记忆桥梁 · AI Bridge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{background:#080402;display:flex;justify-content:center;min-height:100vh;
  font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif}
button{outline:none;-webkit-appearance:none;font-family:inherit;cursor:pointer;border:none}
img{display:block}

/* ── CONTAINER ─────────────────────────────────────────────────── */
#app{width:min(390px,100vw);height:100dvh;position:relative;overflow:hidden;background:#17100A}

/* ── PHOTO CANVAS ──────────────────────────────────────────────── */
#photo-wrap{
  position:absolute;inset:0;z-index:0;
  transform-origin:50% 50%;
  transition:transform .72s cubic-bezier(.4,0,.2,1),transform-origin .72s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
#photo-wrap img{width:100%;height:100%;object-fit:cover;
  transition:filter .9s ease;background:#1c130b}

/* vignette */
.vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 35%,rgba(15,6,1,.5) 100%)}

/* scanning line during analysis */
#scan-line{position:absolute;left:0;right:0;height:2px;top:-2%;z-index:1;opacity:0;pointer-events:none;
  background:linear-gradient(to right,transparent,#8FAA84,transparent)}
#scan-line.show{animation:scanln 2.2s ease-in-out infinite}

/* stage progress bar */
#stage-bar{position:absolute;top:0;left:0;right:0;padding:52px 20px 10px;z-index:1;
  background:linear-gradient(to bottom,rgba(15,6,1,.65) 0%,transparent 100%);
  display:flex;gap:5px;align-items:center;opacity:0;transition:opacity .4s}
#stage-bar.show{opacity:1}
.s-dot{height:3px;border-radius:2px;background:rgba(240,228,204,.25);flex:1;
  transition:background .4s}
.s-dot.done{background:#5C7850}
.s-dot.active{background:#F0E4CC;flex:1.8}
#stage-label{color:rgba(240,228,204,.55);font-size:11px;white-space:nowrap;margin-left:4px}

/* ── PANEL (drawer) ─────────────────────────────────────────────── */
#panel{
  position:absolute;left:0;right:0;bottom:64px;z-index:2;
  background:#F0E4CC;border-radius:22px 22px 0 0;
  box-shadow:0 -6px 36px rgba(0,0,0,.28);
  height:0;overflow:hidden;
  transition:height .42s cubic-bezier(.4,0,.2,1),bottom .3s ease;
}
.panel-handle{width:36px;height:4px;border-radius:2px;
  background:rgba(44,26,14,.17);margin:10px auto 0;flex-shrink:0}
.panel-inner{padding:12px 20px 18px;display:flex;flex-direction:column;height:calc(100% - 24px)}

/* back link */
.back-btn{font-size:14px;color:#A08468;background:none;
  display:flex;align-items:center;gap:4px;margin-bottom:8px;padding:0;flex-shrink:0}

/* AI bubble */
.ai-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;flex-shrink:0}
.ai-avatar{width:30px;height:30px;border-radius:50%;background:#5C7850;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:2px}
.ai-text{font-size:17px;line-height:1.68;color:#2C1A0E;font-weight:400}
.cursor{display:inline-block;width:1.5px;height:15px;background:#5C7850;
  margin-left:2px;animation:blink .85s infinite}

/* transcript box */
.transcript-box{
  background:rgba(122,86,64,.1);border-radius:12px;
  padding:10px 13px;font-size:15px;color:#2C1A0E;
  line-height:1.65;font-style:italic;margin:6px 0;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
  flex-shrink:0;
}
.transcript-box[data-live="0"]{color:#A08468}

/* buttons */
.btn-p{height:52px;border-radius:15px;background:#5C7850;color:#fff;
  font-size:17px;font-weight:700;width:100%;
  box-shadow:0 4px 18px rgba(92,120,80,.38)}
.btn-s{height:48px;border-radius:15px;background:rgba(122,86,64,.1);
  color:#7A5040;font-size:16px;width:100%;margin-top:8px;
  border:1px solid rgba(122,86,64,.2)}
.btn-r{height:52px;border-radius:15px;background:#C04830;color:#fff;
  font-size:17px;font-weight:700;width:100%;
  box-shadow:0 4px 18px rgba(192,72,48,.38)}
.btn-row{display:flex;gap:10px;margin-top:auto}
.btn-row .btn-p,.btn-row .btn-s{margin-top:0;flex:1}

/* dots (thinking indicator) */
.dots{display:flex;gap:8px}
.dots span{width:9px;height:9px;border-radius:50%;background:#A08468;
  animation:dp 1.15s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.22s}
.dots span:nth-child(3){animation-delay:.44s}

/* option cards */
.opt-card{display:flex;gap:12px;align-items:center;
  background:rgba(122,86,64,.08);border:1.5px solid rgba(122,86,64,.18);
  border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:all .18s}
.opt-card.sel{background:rgba(92,120,80,.12);border-color:#5C7850}
.opt-thumb{width:58px;height:58px;border-radius:9px;overflow:hidden;flex-shrink:0;background:rgba(122,86,64,.12)}
.opt-thumb img{width:100%;height:100%;object-fit:cover}
.opt-name{font-size:16px;font-weight:700;color:#2C1A0E}
.opt-desc{font-size:12px;color:#A08468;margin-top:2px;line-height:1.4}
.opt-check{margin-left:auto;color:#5C7850;font-size:20px;flex-shrink:0}

/* spinner */
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(92,120,80,.2);
  border-top-color:#5C7850;animation:spin .9s linear infinite;flex-shrink:0}

/* ── BOTTOM BAR ─────────────────────────────────────────────────── */
#bar{position:absolute;bottom:0;left:0;right:0;height:64px;z-index:4;
  background:#EAD9C1;border-top:1px solid rgba(122,86,64,.14);
  display:flex;align-items:center;justify-content:space-around;
  padding:0 12px 8px;opacity:0;transition:opacity .4s;pointer-events:none}
#bar.show{opacity:1;pointer-events:all}
.bar-btn{display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;padding:6px 14px;border-radius:10px}
.bar-ico{font-size:18px}
.bar-lbl{font-size:10px;color:#8B6448}

/* ── COMPARISON SLIDER ───────────────────────────────────────────── */
#slider-wrap{position:absolute;inset:0;display:none;z-index:3}
#slider-wrap.show{display:block}
.sl-img{position:absolute;inset:0;overflow:hidden}
.sl-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#1c130b}
.sl-img.old{clip-path:inset(0 50% 0 0);transition:clip-path .0s}
.sl-div{position:absolute;top:0;bottom:0;left:50%;width:2px;
  background:rgba(255,255,255,.92);box-shadow:0 0 10px rgba(0,0,0,.3);
  transform:translateX(-50%)}
.sl-handle{position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;
  background:white;box-shadow:0 2px 14px rgba(0,0,0,.28);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:#2C1A0E}
.sl-lbl{position:absolute;bottom:150px;font-size:12px;
  padding:4px 10px;border-radius:8px;color:#fff;pointer-events:none}
.sl-lbl.before{left:14px;background:rgba(0,0,0,.5)}
.sl-lbl.after{right:14px;background:#5C7850}
/* slider bottom buttons */
#sl-btns{position:absolute;bottom:64px;left:0;right:0;
  padding:12px 20px 14px;
  background:linear-gradient(to top,rgba(15,6,1,.75) 0%,transparent 100%)}

/* ── HOME SCREEN ─────────────────────────────────────────────────── */
#home{position:absolute;inset:0;background:#F2E9D8;overflow-y:auto;display:none}
#home.show{display:block}
.home-hd{padding:58px 24px 20px}
.home-eyebrow{font-size:12px;color:#A08468;letter-spacing:.12em;margin-bottom:5px}
.home-brand{font-size:34px;font-weight:700;color:#17100A;line-height:1.1}
.home-brand span{font-size:18px;font-weight:400;color:#A08468;display:block;margin-top:4px}
.home-cards{padding:0 20px 48px;display:flex;flex-direction:column;gap:12px}
/* main card */
.card-main{border-radius:22px;overflow:hidden;position:relative;height:260px;cursor:pointer;
  background:#D4C0A4}
.card-main img{width:100%;height:100%;object-fit:cover;
  filter:sepia(.45) contrast(.9) brightness(.88) saturate(.7)}
.card-overlay{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(15,6,1,.88) 0%,rgba(15,6,1,.2) 55%,transparent 100%);
  padding:20px}
.card-overlay-inner{position:absolute;bottom:22px;left:22px;right:22px}
.card-icon-ph{width:40px;height:40px;border-radius:12px;
  background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;
  font-size:20px;margin-bottom:10px;border:1px solid rgba(255,255,255,.25)}
.card-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:2px}
.card-sub{font-size:13px;color:rgba(255,255,255,.62)}
/* small cards row */
.cards-row{display:flex;gap:12px}
.card-sm{flex:1;border-radius:20px;overflow:hidden;position:relative;height:168px;
  background:#C8B898;opacity:.6}
.card-sm img{width:100%;height:100%;object-fit:cover;
  filter:sepia(.3) contrast(.88) brightness(.85) saturate(.65)}
.card-sm .card-overlay-inner{bottom:16px;left:16px;right:16px}
.card-sm .card-icon-ph{width:32px;height:32px;border-radius:9px;font-size:16px;margin-bottom:7px}
.card-sm .card-title{font-size:15px}
.card-sm .card-sub{font-size:11px}
.coming-tag{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.18);
  color:rgba(255,255,255,.8);font-size:10px;padding:3px 9px;border-radius:20px;
  backdrop-filter:blur(4px)}
/* home bottom nav */
.home-nav{position:sticky;bottom:0;background:#EAD9C1;border-top:1px solid rgba(122,86,64,.14);
  display:flex;justify-content:space-around;padding:10px 0 24px}
.hnav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;padding:4px 20px}
.hnav-ico{font-size:20px}
.hnav-lbl{font-size:10px;color:#A08468}
.hnav-btn.active .hnav-lbl{color:#5C7850;font-weight:600}

/* ── COMPLETE SCREEN ─────────────────────────────────────────────── */
#complete{position:absolute;inset:0;background:rgba(15,6,1,.92);
  display:none;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:0 24px 80px;z-index:2}
#complete.show{display:flex}
.cpl-preview{width:188px;height:234px;border-radius:16px;overflow:hidden;
  box-shadow:0 12px 48px rgba(0,0,0,.6);border:2px solid rgba(240,228,204,.2);margin-bottom:22px;
  background:#1c130b}
.cpl-preview img{width:100%;height:100%;object-fit:cover}
.cpl-title{font-size:24px;font-weight:700;color:#F0E4CC;margin-bottom:6px}
.cpl-sub{font-size:14px;color:rgba(240,228,204,.55);text-align:center;
  line-height:1.7;margin-bottom:28px}
.cpl-actions{width:100%;display:flex;flex-direction:column;gap:10px}
.cpl-btn{height:56px;border-radius:16px;font-size:17px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.cpl-wechat{background:#07C160;color:#fff}
.cpl-local{background:#5C7850;color:#fff}
.cpl-group{background:rgba(240,228,204,.12);color:#F0E4CC;
  border:1.5px solid rgba(240,228,204,.2)}
.cpl-back{background:none;color:rgba(240,228,204,.4);font-size:14px;
  margin-top:8px;padding:8px}

/* ── ERROR TOAST ─────────────────────────────────────────────────── */
.err-toast{position:absolute;top:52px;left:16px;right:16px;z-index:200;
  background:rgba(194,65,40,.95);color:#fff;border-radius:12px;padding:12px 16px;
  display:none;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.3);font-size:14px;line-height:1.5}
.err-toast.show{display:flex}
.err-toast button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;line-height:1;flex-shrink:0}

/* ── ANIMATIONS ─────────────────────────────────────────────────── */
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dp{0%,100%{transform:scale(.65);opacity:.4}50%{transform:scale(1.25);opacity:1}}
@keyframes w0{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1.3)}}
@keyframes w1{0%,100%{transform:scaleY(.85)}50%{transform:scaleY(.38)}}
@keyframes w2{0%,100%{transform:scaleY(1.15)}50%{transform:scaleY(.52)}}
@keyframes w3{0%,100%{transform:scaleY(.52)}50%{transform:scaleY(1.08)}}
@keyframes scanln{0%{top:-2%;opacity:0}8%{opacity:1}90%{opacity:.7}100%{top:108%;opacity:0}}
</style>
</head>
<body>
<div id="app">

  <!-- HIDDEN FILE INPUT -->
  <input id="file-input" type="file" accept="image/*" style="display:none">

  <!-- HOME SCREEN -->
  <div id="home" class="show">
    <div class="home-hd">
      <div class="home-eyebrow">AI Bridge</div>
      <div class="home-brand">记忆桥梁
        <span>让过去的每一张照片，都值得被好好看见</span>
      </div>
    </div>
    <div class="home-cards">
      <!-- Main active card -->
      <div class="card-main" onclick="goTo('upload')">
        <img src="https://picsum.photos/seed/vintage88/390/260" alt="">
        <div class="card-overlay"></div>
        <div class="card-overlay-inner">
          <div class="card-icon-ph" title="[ICON: 记忆桥梁]">🌉</div>
          <div class="card-title">记忆桥梁</div>
          <div class="card-sub">Memory Bridge · 老照片修复与传承</div>
        </div>
      </div>
      <!-- Small inactive cards -->
      <div class="cards-row">
        <div class="card-sm">
          <img src="https://picsum.photos/seed/creative2/185/168" alt="">
          <div class="card-overlay"></div>
          <div class="card-overlay-inner">
            <div class="card-icon-ph" style="width:32px;height:32px;border-radius:9px;font-size:15px" title="[ICON: Creative Bridge]">🎬</div>
            <div class="card-title">创意桥梁</div>
            <div class="card-sub">Creative Bridge</div>
          </div>
          <div class="coming-tag">即将推出</div>
        </div>
        <div class="card-sm">
          <img src="https://picsum.photos/seed/medical3/185/168" alt="">
          <div class="card-overlay"></div>
          <div class="card-overlay-inner">
            <div class="card-icon-ph" style="width:32px;height:32px;border-radius:9px;font-size:15px" title="[ICON: Medical Bridge]">🏥</div>
            <div class="card-title">医疗桥梁</div>
            <div class="card-sub">Medical Bridge</div>
          </div>
          <div class="coming-tag">即将推出</div>
        </div>
      </div>
    </div>
    <div class="home-nav">
      <button class="hnav-btn active"><div class="hnav-ico">◎</div><div class="hnav-lbl">探索</div></button>
      <button class="hnav-btn"><div class="hnav-ico">○</div><div class="hnav-lbl">我的</div></button>
      <button class="hnav-btn"><div class="hnav-ico">○</div><div class="hnav-lbl">设置</div></button>
    </div>
  </div>

  <!-- PHOTO CANVAS (shown for all non-home screens) -->
  <div id="photo-wrap" style="display:none">
    <img id="main-photo" src="" alt="老照片">
    <div class="vignette"></div>
  </div>
  <div id="scan-line"></div>

  <!-- STAGE BAR -->
  <div id="stage-bar">
    <div class="s-dot" id="sd0"></div>
    <div class="s-dot" id="sd1"></div>
    <div class="s-dot" id="sd2"></div>
    <div class="s-dot" id="sd3"></div>
    <div id="stage-label">上传照片</div>
  </div>

  <!-- COMPARISON SLIDER -->
  <div id="slider-wrap">
    <div class="sl-img" id="sl-new">
      <img id="sl-photo-new" src="" alt="">
    </div>
    <div class="sl-img old" id="sl-old" style="clip-path:inset(0 50% 0 0)">
      <img id="sl-photo-old" src="" alt="">
    </div>
    <div class="sl-div" id="sl-div">
      <div class="sl-handle">⇔</div>
    </div>
    <div class="sl-lbl before" id="sl-lbl-before">修复前</div>
    <div class="sl-lbl after" id="sl-lbl-after">修复后</div>
    <div id="sl-btns">
      <div style="display:flex;gap:10px">
        <button class="btn-s" style="flex:1;margin:0;height:50px" id="sl-skip-btn"></button>
        <button class="btn-p" style="flex:2;height:50px" id="sl-confirm-btn"></button>
      </div>
    </div>
    <div class="vignette" style="pointer-events:none"></div>
  </div>

  <!-- PANEL -->
  <div id="panel">
    <div class="panel-handle"></div>
    <div class="panel-inner" id="panel-inner">
      <!-- Content injected by JS -->
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div id="bar">
    <button class="bar-btn" onclick="barAction('exit')">
      <div class="bar-ico">⬡</div>
      <div class="bar-lbl">保存退出</div>
    </button>
    <button class="bar-btn" onclick="barAction('undo')">
      <div class="bar-ico">↩</div>
      <div class="bar-lbl">撤回上步</div>
    </button>
    <button class="bar-btn" onclick="barAction('compare')">
      <div class="bar-ico">◧</div>
      <div class="bar-lbl">对比原图</div>
    </button>
  </div>

  <!-- COMPLETE SCREEN -->
  <div id="complete">
    <div class="cpl-preview">
      <img id="cpl-photo" src="" alt="">
    </div>
    <div class="cpl-title">修复完成了</div>
    <div class="cpl-sub">原照片和每次修复版本都保存好了<br>可以随时再调整</div>
    <div class="cpl-actions">
      <button class="cpl-btn cpl-wechat" onclick="shareAction('wechat')">💬 分享给家人</button>
      <button class="cpl-btn cpl-local" onclick="shareAction('local')">↓ 保存到相册</button>
      <button class="cpl-btn cpl-group" onclick="shareAction('group')">👥 发送到群组</button>
      <button class="cpl-back" onclick="goTo('home')">返回首页</button>
    </div>
  </div>

  <!-- ERROR TOAST -->
  <div id="err-toast" class="err-toast">
    <span class="err-msg"></span>
    <button onclick="clearError()">✕</button>
  </div>

</div><!-- #app -->

<script>
// ─────────────────────────────────────────────────────────────────
// CAMERA — nine-grid area → transform-origin percentage
// ─────────────────────────────────────────────────────────────────
const NINE_GRID = {
  'top-left':{ox:30,oy:24},'top-center':{ox:50,oy:20},'top-right':{ox:70,oy:24},
  'center-left':{ox:28,oy:48},'center':{ox:50,oy:46},'center-right':{ox:72,oy:48},
  'bottom-left':{ox:30,oy:74},'bottom-center':{ox:50,oy:76},'bottom-right':{ox:70,oy:74},
  'full':{ox:50,oy:50},
};
function camFromArea(area, scale) {
  const g = NINE_GRID[area] || NINE_GRID.center;
  return { ox:g.ox, oy:g.oy, sc:scale || 1.7, f:'' };
}
// Nudge the focal point up so the drawer doesn't cover it
function camAdjusted(cam, drawerH) {
  const shift = Math.min(14, ((drawerH || 0) / 844) * 22);
  return { ...cam, oy: Math.max(10, cam.oy - shift) };
}
const CAM = {
  full: { ox:50, oy:50, sc:1, f:'' },
  wide: { ox:50, oy:50, sc:1, f:'' },
  done: { ox:50, oy:50, sc:1, f:'' },
};

// Fallback CSS filters used only when a real image-edit call fails —
// gives a plausible "it improved" visual without pretending nothing broke.
const FALLBACK_DAMAGE_FILTER = 'contrast(1.08) brightness(1.06) saturate(1.05)';
const FALLBACK_FACE_FILTERS = [
  'sepia(0.08) contrast(1.06) brightness(1.12) saturate(1.15)',
  'sepia(0) contrast(1.22) brightness(1.28) saturate(1.2)',
  'sepia(0.42) contrast(1.02) brightness(0.96) saturate(0.9)',
];

// Panel heights per state
const PH = {
  upload:          220,
  story_ask:       210,
  story_rec:       270,
  analyzing:       150,
  damage_detect:   240,
  damage_proc:     170,
  face_intro:      210,
  face_rec:        270,
  face_thinking:   170,
  face_confirm:    275,
  face_generating: 180,
  face_options:    494,
  face_next:       232,
  next_teaser:     252,
};

const STAGES = ['上传', '破损修复', '面部修复', '完成'];

// ─────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────
let cur = 'home';
let selectedOpt = null;
let twTimer = null;
let recTid = null;      // interval id for the recording seconds counter
let recCtl = null;      // {ws, ctx, processor, stream} — active 讯飞 recording session
let slPos = 50;
let slDragging = false;
let faceRound = 0;
let classResult = null;
let pendingTranscript = '';

// Photo / session state — everything the real pipeline needs to remember
let PS = {
  originBase64: null, originMime: 'image/jpeg',
  currentBase64: null, prevBase64: null,
  damageCandidateBase64: null, damageIsFilter: false,
  candidates: [null, null, null],   // {type:'base64'|'filter', data}
  storyContext: '', analysis: null,
};

function esc(s) {

// ─────────────────────────────────────────────────────────────────
// IMAGE HELPERS
// ─────────────────────────────────────────────────────────────────
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
// 手机拍的原图常有 3-8MB，base64 编码后很容易撑爆 Vercel 4.5MB 的请求体上限。
// 上传时统一用 canvas 压成 JPEG 并限制最长边，从第一步就把体积摁住。
function compressImage(file, maxDim = 1600, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      resolve(dataUrl.split(',')[1]);
    };
    img.onerror = reject;
    img.src = url;
  });
}
function imgSrc(base64, mime) { return base64 ? `data:${mime || 'image/jpeg'};base64,${base64}` : ''; }
function setMainPhoto(src) {
  const el = document.getElementById('main-photo');
  if (el && src) el.src = src;
}

// ─────────────────────────────────────────────────────────────────
// 讯飞实时语音听写 — WebSocket, server-signed auth URL (key stays server-side)
// ─────────────────────────────────────────────────────────────────
function cleanupAudio(ctl) {
  if (!ctl) return;
  try {
    ctl.processor?.disconnect();
    ctl.ctx?.close();
    ctl.stream?.getTracks().forEach(t => t.stop());
  } catch (_) {}
}

function startRec(onResult) {
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      fetch('/api/xfyun-auth').then(r => r.json()).then(({ url, appid, error: e }) => {
        if (!url) {
          stream.getTracks().forEach(t => t.stop());
          showError('讯飞鉴权失败：' + (e || '请检查后端 XFYUN 环境变量'));
          return;
        }
        const ws = new WebSocket(url);
        const ctl = { ws, ctx: null, processor: null, stream };
        let accumulated = '';

        ws.onopen = () => {
          ws.send(JSON.stringify({
            common: { app_id: appid },
            business: { language: 'zh_cn', domain: 'iat', accent: 'mandarin', vad_eos: 8000 },
            data: { status: 0, format: 'audio/L16;rate=16000', encoding: 'raw', audio: '' }
          }));
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            ctl.ctx = ctx;
            const src = ctx.createMediaStreamSource(stream);
            const proc = ctx.createScriptProcessor(4096, 1, 1);
            ctl.processor = proc;
            proc.onaudioprocess = ev => {
              if (ws.readyState !== WebSocket.OPEN) return;
              const inp = ev.inputBuffer.getChannelData(0);
              const pcm = new Int16Array(inp.length);
              for (let i = 0; i < inp.length; i++) pcm[i] = Math.max(-32768, Math.min(32767, inp[i] * 32768));
              const b64 = btoa(String.fromCharCode(...new Uint8Array(pcm.buffer)));
              ws.send(JSON.stringify({ data: { status: 1, format: 'audio/L16;rate=16000', encoding: 'raw', audio: b64 } }));
            };
            src.connect(proc); proc.connect(ctx.destination);
          } catch (err) {
            showError('音频处理失败：' + err.message);
            ws.close();
          }
        };

        ws.onmessage = ev => {
          const d = JSON.parse(ev.data);
          if (d.code !== 0) { showError('讯飞识别错误 ' + d.code + '：' + d.message); return; }
          const result = d.data?.result;
          if (result) {
            const words = (result.ws || []).map(w => w.cw.map(c => c.w).join('')).join('');
            if (result.pgs === 'rpl') {
              const rg = result.rg || [0, 0];
              const parts = accumulated.split('|||');
              parts.splice(rg[0], rg[1] - rg[0] + 1, words);
              accumulated = parts.join('');
            } else {
              accumulated += words;
            }
            onResult(accumulated);
          }
          if (d.data?.status === 2) { cleanupAudio(ctl); ws.close(); }
        };

        ws.onerror = () => showError('讯飞 WebSocket 连接失败，请检查网络');
        ws.onclose = () => cleanupAudio(ctl);
        recCtl = ctl;
      }).catch(err => {
        stream.getTracks().forEach(t => t.stop());
        showError('讯飞鉴权请求失败：' + err.message);
      });
    })
    .catch(() => showError('麦克风权限被拒绝，请在浏览器地址栏点击锁图标允许麦克风'));
}

function stopRec() {
  const ctl = recCtl;
  if (!ctl) return;
  if (ctl.ws?.readyState === WebSocket.OPEN) {
    ctl.ws.send(JSON.stringify({ data: { status: 2, format: 'audio/L16;rate=16000', encoding: 'raw', audio: '' } }));
  }
  cleanupAudio(ctl);
  recCtl = null;
}

// ─────────────────────────────────────────────────────────────────
function showSlider(oldSrc, newSrc, opts = {}) {
  slPos = 50;
  const sw = document.getElementById('slider-wrap');
  sw.classList.add('show');
  document.getElementById('bar').classList.add('show');

  document.getElementById('sl-photo-old').src = oldSrc;
  document.getElementById('sl-photo-old').style.filter = '';
  document.getElementById('sl-photo-new').src = newSrc;
  document.getElementById('sl-photo-new').style.filter = opts.newFilter || '';
  document.getElementById('sl-lbl-before').textContent = opts.beforeLabel || '修复前';
  document.getElementById('sl-lbl-after').textContent = opts.afterLabel || '修复后';

  const skipBtn = document.getElementById('sl-skip-btn');
  const confirmBtn = document.getElementById('sl-confirm-btn');

  if (opts.closeOnly) {
    skipBtn.style.display = 'none';
    confirmBtn.style.flex = '1';
    confirmBtn.textContent = opts.confirmLabel || '关闭对比';
    confirmBtn.onclick = () => { closeSlider(); opts.onConfirm && opts.onConfirm(); };
  } else {
    skipBtn.style.display = '';
    confirmBtn.style.flex = '2';
    skipBtn.textContent = opts.skipLabel || '重新选';
    confirmBtn.textContent = opts.confirmLabel || '满意，继续';
    skipBtn.onclick = () => { closeSlider(); opts.onSkip && opts.onSkip(); };
    confirmBtn.onclick = () => animSliderConfirm(opts.onConfirm);
  }
  updateSlider();
}

function updateSlider() {
  document.getElementById('sl-old').style.clipPath = `inset(0 ${100-slPos}% 0 0)`;
  document.getElementById('sl-div').style.left = slPos + '%';
}

function animSliderConfirm(onDone) {
  document.getElementById('sl-btns').style.opacity = '0';
  document.getElementById('sl-btns').style.pointerEvents = 'none';
  const start = slPos;
  const dur = 620;
  const t0 = performance.now();
  function step(t) {
    const p = Math.min(1, (t-t0)/dur);
    const ease = p < .5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
    slPos = start * (1-ease);
    updateSlider();
    if (p < 1) requestAnimationFrame(step);
    else { closeSlider(); onDone && onDone(); }
  }
  requestAnimationFrame(step);
}

function closeSlider() {
  document.getElementById('slider-wrap').classList.remove('show');
  document.getElementById('sl-btns').style.opacity = '';
  document.getElementById('sl-btns').style.pointerEvents = '';
}

// slider drag
(function(){
  const sw = document.getElementById('slider-wrap');
  function move(cx) {
    const r = sw.getBoundingClientRect();
    slPos = Math.max(4, Math.min(96, ((cx - r.left)/r.width)*100));
    updateSlider();
  }
  sw.addEventListener('mousedown', e=>{ slDragging=true; move(e.clientX); });
  sw.addEventListener('touchstart', e=>{ slDragging=true; move(e.touches[0].clientX); },{passive:true});
  window.addEventListener('mousemove', e=>{ if(slDragging) move(e.clientX); });
  window.addEventListener('touchmove', e=>{ if(slDragging) move(e.touches[0].clientX); },{passive:true});
  window.addEventListener('mouseup', ()=>slDragging=false);
  window.addEventListener('touchend', ()=>slDragging=false);
})();

// ─────────────────────────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let b64;
  try {
    b64 = await compressImage(file); // 统一压成 JPEG，限制最长边
  } catch (err) {
    b64 = await fileToBase64(file); // 压缩失败兜底：极少数机型/格式不支持 canvas 编码时，退回原图
  }
  const mime = 'image/jpeg';
  PS.originBase64 = b64; PS.originMime = mime;
  PS.currentBase64 = b64; PS.prevBase64 = b64;
  setMainPhoto(imgSrc(b64, mime));
  goTo('story_ask');
});

// ─────────────────────────────────────────────────────────────────
// SCREEN ROUTER
// ─────────────────────────────────────────────────────────────────
function goTo(state) {
  cur = state;
  stopRec();
  if (recTid) clearInterval(recTid);
  closeSlider();
  hidePanel();
  document.getElementById('scan-line').classList.remove('show');
  document.getElementById('home').classList.remove('show');
  document.getElementById('complete').classList.remove('show');
  document.getElementById('stage-bar').classList.remove('show');
  document.getElementById('bar').classList.remove('show');

  if (state === 'home') {
    hideCanvas();
    faceRound = 0; selectedOpt = null; classResult = null; pendingTranscript = '';
    PS = { originBase64:null, originMime:'image/jpeg', currentBase64:null, prevBase64:null,
      damageCandidateBase64:null, damageIsFilter:false, candidates:[null,null,null],
      storyContext:'', analysis:null };
    clearError();
    document.getElementById('home').classList.add('show');
    return;
  }

  if (state === 'complete') {
    showCanvas();
    setCamera('done');
    const finalSrc = imgSrc(PS.currentBase64 || PS.originBase64, PS.originMime);
    setMainPhoto(finalSrc);
    document.getElementById('cpl-photo').src = finalSrc;
    document.getElementById('complete').classList.add('show');
    document.getElementById('bar').classList.add('show');
    return;
  }

  showCanvas();
  // 每次进入一个新屏幕都把底图同步到最新状态。之前只有上传那一刻设置过一次，
  // 破损修复/面部编辑确认之后都没有再更新 #main-photo，导致滑杆对比时看到的是新结果，
  // 一回到常规屏幕又变回最初上传的原图——状态其实一直是对的，只是没有画出来。
  setMainPhoto(imgSrc(PS.currentBase64 || PS.originBase64, PS.originMime));
  screens[state]?.();
}

  face_thinking() {
    setStage(2,'理解您的想法');
    showPanel(PH.face_thinking, `
      <div class="ai-row">
        <div class="ai-avatar" title="[ICON: AI Avatar]">🌉</div>
        <div class="ai-text" data-msg="我听到了，稍等一下……"></div>
      </div>
      <div class="dots" style="margin-top:14px;padding-left:44px">
        <span></span><span></span><span></span>
      </div>`);
    runClassify();
  },

  face_confirm() {
    setStage(2,'面部修复');
    const unsupported = classResult?.attribute_status === 'unsupported';
    const msg = unsupported
      ? ('这个我暂时还做不到——' + esc(classResult?.unsupported_reason || '超出了当前修复范围') + '，要换一个方向说说吗？')
      : esc(classResult?.confirmation_phrase || '我听到了，是这个意思吗？');
    showPanel(PH.face_confirm, `
      <div class="ai-row">
        <div class="ai-avatar" title="[ICON: AI Avatar]">🌉</div>
        <div class="ai-text" data-msg="${msg}"></div>
      </div>
      <div class="btn-row" style="margin-top:auto">
        ${unsupported
          ? `<button class="btn-p" style="flex:1" onclick="goTo('face_rec')">好的，换个方向说</button>`
          : `<button class="btn-s" style="margin:0;flex:1" onclick="goTo('face_rec')">重新说</button>
             <button class="btn-p" style="flex:2" onclick="goTo('face_generating')">对的，就是这个意思</button>`
        }
      </div>`);
  },

  face_generating() {
    setStage(2,'生成修复效果');
    selectedOpt = null;
    showPanel(PH.face_generating, `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <div class="spin"></div>
        <div style="font-size:15px;color:#2C1A0E;line-height:1.65" id="gen-txt">正在同时生成三种效果……</div>
      </div>
      <div style="font-size:12px;color:#A08468;line-height:1.6">三种效果并行生成，大约需要20-40秒，请耐心等待。</div>`);
    runFaceGenerate();
  },

  face_options() {
    setStage(2,'选择方案');
    const labels = (classResult?.intents?.length > 0) ? ['方案一','方案二','方案三'] : ['自然修复','明亮清晰','保留年代感'];
    const descs = ['轻度还原，保留神韵','强化细节，整体明亮','修复损伤，留年代感'];
    const optHtml = PS.candidates.map((c,i)=>{
      const thumbSrc = c?.type === 'base64' ? imgSrc(c.data, PS.originMime) : imgSrc(PS.currentBase64, PS.originMime);
      const thumbFilter = c?.type === 'filter' ? c.data : '';
      return `
      <div class="opt-card" id="opt-${i}" onclick="selectOpt(${i})">
        <div class="opt-thumb">
          <img src="${thumbSrc}" style="filter:${thumbFilter}">
        </div>
        <div style="flex:1">
          <div class="opt-name">${labels[i]}</div>
          <div class="opt-desc">${descs[i]}</div>
        </div>
        <div class="opt-check" id="oc-${i}" style="display:none">✓</div>
      </div>`;
    }).join('');
    showPanel(PH.face_options, `
      <div class="ai-row" style="margin-bottom:10px">
        <div class="ai-avatar" style="width:26px;height:26px;font-size:13px" title="[ICON: AI Avatar]">🌉</div>
        <div class="ai-text" style="font-size:15px" data-msg="好了，这是三种修复效果，您看哪个最接近心里想的？"></div>
      </div>
      <div style="flex:1;overflow:hidden">${optHtml}</div>
      <button class="btn-p" id="use-btn" style="opacity:.4;pointer-events:none;margin-top:6px" onclick="goTo('face_compare')">用这张对比一下</button>`,
      { hideBar: true });
  },

  face_next() {
    setCamera(camAdjusted(camFromArea(PS.analysis?.face?.area, 1.7), PH.face_next));
    setStage(2,'面部修复');
    showPanel(PH.face_next, `
      <div class="ai-row">
        <div class="ai-avatar" title="[ICON: AI Avatar]">🌉</div>
        <div class="ai-text" data-msg="这个效果保存好了。面部还想继续调整吗？"></div>
      </div>
      <div class="btn-row" style="margin-top:auto">
        <button class="btn-p" onclick="goTo('face_rec')">还想改改</button>
        <button class="btn-s" style="margin:0" onclick="goTo('next_teaser')">面部修完了</button>
      </div>`);
  },

  next_teaser() {
    setCamera('done'); setStage(3,'下一步');
    showPanel(PH.next_teaser, `
      <div class="ai-row">
        <div class="ai-avatar" title="[ICON: AI Avatar]">🌉</div>
        <div class="ai-text" data-msg="接下来，您想不想改改照片的色调和颜色？"></div>
      </div>
      <div style="padding:10px 12px;background:rgba(122,86,64,.08);border-radius:12px;
        font-size:13px;color:#A08468;margin:10px 0;line-height:1.6">
        💡 色彩调整、背景修复功能即将开放，敬请期待
      </div>
      <div class="btn-row" style="margin-top:auto">
        <button class="btn-p" onclick="goTo('complete')">直接完成修复</button>
      </div>`);
  },

  face_compare() {
    setStage(2,'对比修复效果');
    PS.prevBase64 = PS.currentBase64;
    const c = PS.candidates[selectedOpt];
    const newSrc = c?.type === 'base64' ? imgSrc(c.data, PS.originMime) : imgSrc(PS.currentBase64, PS.originMime);
    const newFilter = c?.type === 'filter' ? c.data : '';
    setCamera('wide');
    showSlider(
      imgSrc(PS.prevBase64, PS.originMime),
      newSrc,
      {
        newFilter,
        skipLabel: '重新选',
        confirmLabel: faceRound < 2 ? '满意，继续调' : '满意，完成修复',
        onSkip: () => goTo('face_options'),
        onConfirm: () => {
          const chosen = PS.candidates[selectedOpt];
          if (chosen?.type === 'base64') PS.currentBase64 = chosen.data;
          PS.candidates = [null,null,null];
          selectedOpt = null;
          faceRound++;
          goTo(faceRound < 2 ? 'face_next' : 'next_teaser');
        }
      }
    );
  },
};

// ─────────────────────────────────────────────────────────────────
// ASYNC PIPELINE — the actual real-API steps
// ─────────────────────────────────────────────────────────────────
async function runAnalysis() {
  try {
    const res = await apiAnalyze(PS.originBase64, PS.originMime);
    if (cur !== 'analyzing') return; // user navigated away meanwhile
    PS.analysis = res?.result || null;
    if (PS.analysis?.damage?.detected) goTo('damage_detect');
    else goTo('face_intro');
  } catch (e) {
    if (cur !== 'analyzing') return;
    PS.analysis = null;
    goTo('face_intro'); // graceful degrade: skip analysis, still let the user work
  }
}

async function runDamageRepair() {
  const steps = ['分析损伤区域…','识别纹理特征…','应用修复算法…','等待生成结果…'];
  let i = 0;
  const cycle = setInterval(() => {
    if (cur !== 'damage_proc') { clearInterval(cycle); return; }
    i = Math.min(i + 1, steps.length - 1);
    const txt = document.getElementById('proc-txt');
    const bar = document.getElementById('proc-bar');
    if (txt) txt.textContent = steps[i];
    if (bar) bar.style.width = (12 + i * 22) + '%'; // cosmetic only — real completion below decides when we move on
  }, 1800);

  const instruction = "Repair all visible scratches, tears, fold marks, stains, and physical damage in this photograph. Carefully reconstruct any missing or damaged areas to match the surrounding content. Preserve the original subjects, colors, composition, and photographic style exactly as they were.";

  let result = { ok: false };
  try { result = await apiEdit(PS.originBase64, PS.originMime, instruction); }
  catch (e) { result = { ok: false, error: String(e?.message || e) }; }

  clearInterval(cycle);
  if (cur !== 'damage_proc') return;

  if (result?.ok && result.imageBase64) {
    PS.damageCandidateBase64 = result.imageBase64;
    PS.damageIsFilter = false;
  } else {
    // API 不可用时优雅降级：用滤镜模拟观感变化，不打断体验
    PS.damageCandidateBase64 = PS.originBase64;
    PS.damageIsFilter = true;
  }
  PS.prevBase64 = PS.originBase64;
  setCamera('wide');
  showSlider(
    imgSrc(PS.prevBase64, PS.originMime),
    imgSrc(PS.damageCandidateBase64, PS.originMime),
    {
      newFilter: PS.damageIsFilter ? FALLBACK_DAMAGE_FILTER : '',
      skipLabel: '跳过修补',
      confirmLabel: '修复效果好，继续',
      onSkip: () => { PS.damageCandidateBase64 = null; goTo('face_intro'); },
      onConfirm: () => {
        PS.currentBase64 = PS.damageIsFilter ? PS.originBase64 : PS.damageCandidateBase64;
        PS.damageCandidateBase64 = null;
        goTo('face_intro');
      }
    }
  );
}

function finishStoryRec() {
  clearInterval(recTid);
  stopRec();
  const el = document.getElementById('story-transcript');
  PS.storyContext = (el && el.dataset.live === '1') ? el.textContent.trim() : '';
  goTo('analyzing');
}

function finishFaceRec() {
  clearInterval(recTid);
  stopRec();
  const el = document.getElementById('face-transcript');
  const text = (el && el.dataset.live === '1') ? el.textContent.trim() : '';
  if (!text) { showError('好像没有收到您说的内容，请再说一次。'); goTo('face_rec'); return; }
  pendingTranscript = text;
  goTo('face_thinking');
}

async function runClassify() {
  try {
    const res = await apiClassify(pendingTranscript, PS.storyContext, 'face');
    if (cur !== 'face_thinking') return;
    if (!res?.ok) {
      const errMsg = typeof res?.error === 'string' ? res.error : JSON.stringify(res?.error || res?.raw || res || '接口返回异常');
      showError('意图理解失败：' + errMsg.slice(0,120));
      goTo('face_intro');
      return;
    }
    classResult = res.result;
    goTo('face_confirm');
  } catch (e) {
    if (cur !== 'face_thinking') return;
    showError('请求失败：' + String(e?.message || e));
    goTo('face_intro');
  }
}

async function runFaceGenerate() {
  const variants = (classResult?.variants?.length > 0) ? classResult.variants : [
    '轻度修复面部细节，保留人物自然神韵，整体风格不变',
    '明显提升面部清晰度和亮度，让人物面貌更鲜明',
    '温和修复面部，保留老照片的年代质感和整体氛围',
  ];
  // 三次 edit 相互独立，并行发出去，总等待时间约等于最慢的那一张，
  // 而不是三张时间加总——这是之前"生成时间很久"的主因。
  const results = await Promise.all(variants.map(async (instruction, i) => {
    try {
      const r = await apiEdit(PS.currentBase64, PS.originMime, instruction);
      return (r?.ok && r.imageBase64) ? { type:'base64', data:r.imageBase64 } : { type:'filter', data:FALLBACK_FACE_FILTERS[i] };
    } catch (e) {
      return { type:'filter', data:FALLBACK_FACE_FILTERS[i] };
    }
  }));
  if (cur !== 'face_generating') return;
  PS.candidates = results;
  goTo('face_options');
}

// ─────────────────────────────────────────────────────────────────
// SELECT OPTION
// ─────────────────────────────────────────────────────────────────
function selectOpt(i) {
  selectedOpt = i;
  [0,1,2].forEach(j=>{
    document.getElementById('opt-'+j)?.classList.toggle('sel',j===i);
    const oc = document.getElementById('oc-'+j);
    if (oc) oc.style.display = j===i?'block':'none';
  });
  const btn = document.getElementById('use-btn');
  if (btn) { btn.style.opacity='1'; btn.style.pointerEvents=''; }
}

// ─────────────────────────────────────────────────────────────────
// BAR ACTIONS
// ─────────────────────────────────────────────────────────────────
function barAction(action) {
  if (action === 'exit') {
    if (confirm('保存进度并退出？')) goTo('home');
  } else if (action === 'undo') {
    const prev = {
      damage_proc:'damage_detect', face_rec:'face_intro',
      face_thinking:'face_rec', face_confirm:'face_thinking',
      face_generating:'face_confirm', face_options:'face_confirm',
      face_compare:'face_options', face_next:'face_compare',
      next_teaser:'face_next', complete:'next_teaser',
    };
    if (prev[cur]) goTo(prev[cur]);
  } else if (action === 'compare') {
    if (!PS.originBase64) return;
    showSlider(
      imgSrc(PS.originBase64, PS.originMime),
      imgSrc(PS.currentBase64 || PS.originBase64, PS.originMime),
      { closeOnly:true, beforeLabel:'原始照片', afterLabel:'当前效果', confirmLabel:'关闭对比' }
    );
  }
}

// ─────────────────────────────────────────────────────────────────
// SHARE ACTIONS
// ─────────────────────────────────────────────────────────────────
function shareAction(type) {
  const msgs = { wechat:'已分享给家人（小程序功能）', local:'已保存到相册', group:'已发送到群组（小程序功能）' };
  alert(msgs[type] || '操作完成');
}

// ─────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────
goTo('home');
</script>
