// ─── HELPERS ───────────────────────────────────────────────────────────────
function useTW(text,spd=32){
  const[out,setOut]=useState("");
  useEffect(()=>{
    if(!text){setOut("");return;}
    setOut("");let i=0;
    const t=setInterval(()=>{i++;setOut(text.slice(0,i));if(i>=text.length)clearInterval(t);},spd);
    return()=>clearInterval(t);
  },[text]);
  return out;
}

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result.split(",")[1]);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

function imgSrc(base64,mime){return`data:${mime||"image/jpeg"};base64,${base64}`;}

async function apiAnalyze(imageBase64,mimeType){

}

// ─── COMPARISON SLIDER ─────────────────────────────────────────────────────
function ComparisonSlider({oldSrc,newSrc,onConfirm,hasNext}){
  const[pos,setPos]=useState(50);
  const[confirmed,setConfirmed]=useState(false);
  const animRef=useRef(false);
  const cRef=useRef();

  const move=useCallback((cx)=>{
    if(animRef.current||confirmed)return;
    const r=cRef.current?.getBoundingClientRect();
    if(!r)return;
    setPos(Math.max(4,Math.min(96,((cx-r.left)/r.width)*100)));
  },[confirmed]);

  const onTM=e=>move(e.touches[0].clientX);
  const onMM=e=>{if(e.buttons===1)move(e.clientX);};

  const confirm=()=>{setConfirmed(true);animRef.current=true;setPos(0);};
  const onTE=()=>{if(animRef.current){animRef.current=false;onConfirm();}};

  return(
    <div ref={cRef} style={{position:"absolute",inset:0,cursor:"col-resize"}}
      onMouseMove={onMM} onTouchMove={onTM}>
      {/* New photo — full bg */}
      <img src={newSrc} style={{position:"absolute",inset:0,
        width:"100%",height:"100%",objectFit:"cover"}}/>
      {/* Old photo — clipped */}
      <div style={{
        position:"absolute",inset:0,
        clipPath:`inset(0 ${100-pos}% 0 0)`,
        transition:animRef.current?"clip-path .65s cubic-bezier(.4,0,.2,1)":"none",
      }} onTransitionEnd={onTE}>
        <img src={oldSrc} style={{position:"absolute",inset:0,
          width:"100%",height:"100%",objectFit:"cover"}}/>
        {!confirmed&&(
          <div style={{position:"absolute",bottom:160,left:14,
            background:"rgba(0,0,0,.5)",color:"#fff",fontSize:12,
            padding:"4px 10px",borderRadius:8,fontFamily:F}}>修复前</div>
        )}
      </div>
      {/* Divider */}
      {!confirmed&&(
        <div style={{position:"absolute",top:0,bottom:0,left:`${pos}%`,
          width:2,background:P.white,boxShadow:"0 0 10px rgba(0,0,0,.3)",
          transform:"translateX(-50%)",pointerEvents:"none"}}>
          <div style={{position:"absolute",top:"50%",left:"50%",
            transform:"translate(-50%,-50%)",width:44,height:44,borderRadius:"50%",
            background:P.white,boxShadow:"0 2px 12px rgba(0,0,0,.28)",
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:18,color:P.ink,pointerEvents:"all",cursor:"col-resize"}}>⇔</div>
        </div>
      )}
      {!confirmed&&(
        <div style={{position:"absolute",bottom:160,right:14,
          background:P.sage,color:"#fff",fontSize:12,
          padding:"4px 10px",borderRadius:8,fontFamily:F}}>修复后</div>
      )}
      {/* Confirm button */}
      {!confirmed&&(
        <div style={{position:"absolute",bottom:60,left:0,right:0,
          padding:"12px 20px 16px",
          background:"linear-gradient(to top,rgba(0,0,0,.72),transparent)"}}>
          <Btn label={hasNext?"就选这张，继续":"就选这张，完成修复"}
            onClick={confirm} primary full/>
        </div>
      )}
    </div>
  );
}

// ─── GLOBAL COMPARE OVERLAY ────────────────────────────────────────────────
function GlobalCompare({originSrc,currentSrc,onClose}){
  const[pos,setPos]=useState(50);
  const cRef=useRef();
  const move=cx=>{
    const r=cRef.current?.getBoundingClientRect();
    if(!r)return;
    setPos(Math.max(4,Math.min(96,((cx-r.left)/r.width)*100)));
  };
  return(
    <div ref={cRef} style={{position:"absolute",inset:0,zIndex:100,cursor:"col-resize"}}
      onMouseMove={e=>{if(e.buttons===1)move(e.clientX);}}
      onTouchMove={e=>move(e.touches[0].clientX)}>
      <img src={currentSrc} style={{position:"absolute",inset:0,
        width:"100%",height:"100%",objectFit:"cover"}}/>
      <div style={{position:"absolute",inset:0,
        clipPath:`inset(0 ${100-pos}% 0 0)`}}>
        <img src={originSrc} style={{position:"absolute",inset:0,
          width:"100%",height:"100%",objectFit:"cover"}}/>
        <div style={{position:"absolute",bottom:140,left:14,
          background:"rgba(0,0,0,.5)",color:"#fff",fontSize:12,
          padding:"4px 10px",borderRadius:8}}>原始照片</div>
      </div>
      <div style={{position:"absolute",top:0,bottom:0,left:`${pos}%`,
        width:2,background:P.white,transform:"translateX(-50%)",pointerEvents:"none"}}>
        <div style={{position:"absolute",top:"50%",left:"50%",
          transform:"translate(-50%,-50%)",width:44,height:44,borderRadius:"50%",
          background:P.white,display:"flex",alignItems:"center",justifyContent:"center",
          fontSize:18,pointerEvents:"all",cursor:"col-resize"}}>⇔</div>
      </div>
      <div style={{position:"absolute",bottom:140,right:14,
        background:P.sage,color:"#fff",fontSize:12,
        padding:"4px 10px",borderRadius:8}}>当前修复</div>
      <div style={{position:"absolute",top:0,left:0,right:0,
        padding:"52px 20px 14px",
        background:"linear-gradient(to bottom,rgba(0,0,0,.6),transparent)"}}>
        <div style={{color:"#fff",fontSize:13,textAlign:"center",fontFamily:F}}>
          拖动滑杆对比原图 · 点击任意处返回
        </div>
      </div>
      <div style={{position:"absolute",inset:0}} onClick={onClose}/>
    </div>
  );
}

// ─── MAIN APP ──────────────────────────────────────────────────────────────
function App(){
  // ── State ────────────────────────────────────────────────────────────────
  const[screen,setScreen]=useState(S.HOME);
  const[cam,setCam]=useState(WIDE_CAM);
  const[aiText,setAiText]=useState("");
  const[recSec,setRecSec]=useState(0);
  const[transcript,setTranscript]=useState("");

  // Image state chain
  const[img,setImg]=useState({
    originBase64:null,originMime:"image/jpeg",
    currentBase64:null,// what's shown now
    prevBase64:null,   // previous stage (for compare left)
    candidates:[null,null,null],// three options base64
    storyContext:"",
    analysis:null,     // {damage,face}
  });

  const[selectedOpt,setSelectedOpt]=useState(null);
  const[globalCompare,setGlobalCompare]=useState(false);
  const[error,setError]=useState(null);
  const[isRec,setIsRec]=useState(false);
  const[classResult,setClassResult]=useState(null);

  const recRef=useRef(null);   // {ws, audio} iFlytek WebSocket
  const fileRef=useRef();
  const camRef=useRef();

  // ── Recording timer ───────────────────────────────────────────────────────
  useEffect(()=>{
    if(screen!==S.FACE_REC&&screen!==S.STORY_REC){setRecSec(0);return;}
    const t=setInterval(()=>setRecSec(s=>s+1),1000);
    return()=>clearInterval(t);
  },[screen]);

  // ── Camera helper ─────────────────────────────────────────────────────────
  const moveCam=useCallback((c)=>setCam(c||WIDE_CAM),[]);

  // ── iFlytek WebSocket 实时语音识别 ────────────────────────────────────────
  function cleanupAudio(a){
    if(!a)return;
    try{a.processor?.disconnect();a.ctx?.close();a.stream?.getTracks().forEach(t=>t.stop());}catch(_){}
  }

  const startRec=useCallback((onResult)=>{
    // 从后端获取鉴权 URL（保护 APISecret 不暴露前端）
    fetch("/api/xfyun-auth")
      .then(r=>r.json())
      .then(({url,error:e})=>{
        if(!url){setError("讯飞鉴权失败："+( e||"请检查 APPID/APIKey/APISecret"));return;}

        const ws=new WebSocket(url);
        const audioCtx={ctx:null,processor:null,stream:null};
        let accumulated="";

        ws.onopen=async()=>{
          // 发送第一帧（业务参数）
          ws.send(JSON.stringify({
            common:{app_id:""},
            business:{language:"zh_cn",domain:"iat",accent:"mandarin",vad_eos:2000,dwa:"wpgs"},
            data:{status:0,format:"audio/L16;rate=16000",encoding:"raw",audio:""}
          }));
          // 请求麦克风
          try{
            const stream=await navigator.mediaDevices.getUserMedia({audio:true});
            audioCtx.stream=stream;
            const ctx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
            audioCtx.ctx=ctx;
            const src=ctx.createMediaStreamSource(stream);
            const proc=ctx.createScriptProcessor(1280,1,1);
            audioCtx.processor=proc;
            proc.onaudioprocess=ev=>{
              if(ws.readyState!==WebSocket.OPEN)return;
              const inp=ev.inputBuffer.getChannelData(0);
              const pcm=new Int16Array(inp.length);
              for(let i=0;i<inp.length;i++)pcm[i]=Math.max(-32768,Math.min(32767,inp[i]*32768));
              const b64=btoa(String.fromCharCode(...new Uint8Array(pcm.buffer)));
              ws.send(JSON.stringify({data:{status:1,format:"audio/L16;rate=16000",encoding:"raw",audio:b64}}));
            };
            src.connect(proc);proc.connect(ctx.destination);
            setIsRec(true);
          }catch(err){
            setError("麦克风权限被拒绝，请在浏览器地址栏点击锁图标允许麦克风");
            ws.close();
          }
        };

        ws.onmessage=ev=>{
          const d=JSON.parse(ev.data);
          if(d.code!==0){setError("讯飞识别错误 "+d.code+"："+d.message);return;}
          const words=(d.data?.result?.ws||[]).map(w=>w.cw.map(c=>c.w).join("")).join("");
          if(words){accumulated+=words;onResult(accumulated);}
          if(d.data?.status===2){cleanupAudio(audioCtx);ws.close();}
        };

        ws.onerror=()=>setError("讯飞 WebSocket 连接失败，请检查网络");
        ws.onclose=()=>{cleanupAudio(audioCtx);setIsRec(false);};
        recRef.current={ws,audio:audioCtx};
      })
      .catch(err=>setError("讯飞鉴权请求失败："+err.message));
  },[]);

  const stopRec=useCallback(()=>{

    if(!ref)return;
    if(ref.ws?.readyState===WebSocket.OPEN){
      // 发送结束帧，让服务端返回最终识别结果
      ref.ws.send(JSON.stringify({data:{status:2,format:"audio/L16;rate=16000",encoding:"raw",audio:""}}));
    }

    recRef.current=null;
  },[]);

  // ── File upload handler ───────────────────────────────────────────────────

      }

      goToFaceIntro(null);
    }

    setScreen(S.FACE_INTRO);
  },[moveCam]);

    moveCam(dmgArea?(AREA_CAM[dmgArea]||DEFAULT_DMG_CAM):DEFAULT_DMG_CAM);

  const stopFaceRec=async()=>{

    setScreen(S.FACE_THINKING);

    try{
      const res=await apiClassify(finalText,img.storyContext,"face");

          ? res.error

        setScreen(S.FACE_INTRO);

        return;
      }

      }

      setScreen(S.FACE_INTRO);

          {screen===S.FACE_OPTIONS&&(
            <>
              <AiBubble text={aiText} small/>
              <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:10,flex:1,overflow:"auto"}}>
                {img.candidates.map((c,i)=>{
                  const labels=classResult?.intents?.length>0
                    ?["方案一","方案二","方案三"]
                    :["自然修复","明亮清晰","保留年代感"];
                  return(
                    <div key={i} onClick={()=>handleSelectOpt(i)} style={{
                      display:"flex",gap:12,alignItems:"center",
                      background:selectedOpt===i?"rgba(113,137,104,.14)":P.brownGhost,
                      border:`1.5px solid ${selectedOpt===i?P.sage:P.brownBorder}`,
                      borderRadius:14,padding:"10px 12px",cursor:"pointer",
                      transition:"all .18s",
                    }}>
                      <div style={{width:64,height:64,borderRadius:9,overflow:"hidden",flexShrink:0,
                        background:"rgba(122,86,64,.1)",display:"flex",alignItems:"center",justifyContent:"center"}}>
                        {c?(
                          <img src={imgSrc(c,img.originMime)}
                            style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                        ):(
                          <Spinner size={22}/>
                        )}
                      </div>
                      <div style={{flex:1}}>
                        <div style={{color:P.ink,fontSize:16,fontWeight:700,fontFamily:F}}>{labels[i]}</div>
                        <div style={{color:P.dust,fontSize:13,marginTop:2,fontFamily:F}}>
                          {i===0?"轻度还原，保留神韵":i===1?"强化细节，整体明亮":"修复损伤，留年代感"}
                        </div>
                      </div>
                      {selectedOpt===i&&<div style={{color:P.sage,fontSize:20}}>✓</div>}
                    </div>
                  );
                })}
              </div>
              {selectedOpt!==null&&(
                <div style={{marginTop:10}}>
                  <Btn label="用这张对比一下" onClick={handleGoCompare} primary full/>
                </div>
              )}
            </>
          )}

          {/* FACE_NEXT_ASK */}
          {screen===S.FACE_NEXT_ASK&&(
            <>
              <AiBubble text={aiText}/>
              <div style={{marginTop:"auto",display:"flex",gap:10}}>
                <Btn label="还想改改" onClick={handleFaceMoreYes} primary/>
                <Btn label="面部修完了" onClick={handleFaceDone}/>
              </div>
            </>
          )}

          {/* COLOR_TEASER */}
          {screen===S.COLOR_TEASER&&(
            <>
              <AiBubble text={aiText}/>
              <div style={{marginTop:10,padding:"10px 12px",
                background:P.brownGhost,borderRadius:12,
                color:P.muted,fontSize:13,fontFamily:F,lineHeight:1.6}}>
                💡 色彩调整、背景修复等功能正在开发中，敬请期待。
              </div>
              <div style={{marginTop:"auto",display:"flex",gap:10}}>
                <Btn label="保存当前成果" onClick={()=>{}} primary/>
                <Btn label="返回首页" onClick={()=>{setScreen(S.HOME);setImg({originBase64:null,originMime:"image/jpeg",currentBase64:null,prevBase64:null,candidates:[null,null,null],storyContext:"",analysis:null});}}/>
              </div>
            </>
          )}

        </Drawer>
      )}

      {/* ── LAYER 3: BOTTOM BAR ── */}
      <BottomBar
        state={screen}
        stages={[]}
        currentStage="face"
        onGlobalCompare={()=>{if(photoSrc&&originSrc)setGlobalCompare(true);}}
      />

      {/* ── ERROR TOAST ── */}
      {error&&(
        <div style={{position:"absolute",top:52,left:16,right:16,
          background:"rgba(194,65,40,.95)",color:"#fff",
          borderRadius:12,padding:"12px 16px",
          display:"flex",justifyContent:"space-between",alignItems:"center",
          boxShadow:"0 4px 20px rgba(0,0,0,.3)",zIndex:200,fontFamily:F,fontSize:14}}>
          <span>{error}</span>
          <button onClick={()=>setError(null)} style={{
            background:"none",border:"none",color:"#fff",fontSize:18,cursor:"pointer",
            marginLeft:12,lineHeight:1}}>✕</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
