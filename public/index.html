// ─── HELPERS ───────────────────────────────────────────────────────────────
function useTW(text,spd=32){
  const[out,setOut]=useState("");
  useEffect(()=>{
    if(!text){setOut("");return;}
    setOut("");let i=0;
    const t=setInterval(()=>{i++;setOut(text.slice(0,i));if(i>=text.length)clearInterval(t);},spd);
    return()=>clearInterval(t);
  },[text]);
  return out;
}

// 压缩图片到 1200px 以内再转 base64，避免超出 Vercel 4.5MB 请求体限制
function compressToBase64(file, maxPx=1200, quality=0.82){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1, maxPx/Math.max(img.width,img.height));
      const canvas=document.createElement("canvas");
      canvas.width=Math.round(img.width*scale);
      canvas.height=Math.round(img.height*scale);
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl=canvas.toDataURL("image/jpeg",quality);
      URL.revokeObjectURL(img.src);
      res(dataUrl.split(",")[1]);
    };
    img.onerror=rej;
    img.src=URL.createObjectURL(file);
  });
}

function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result.split(",")[1]);
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

function imgSrc(base64,mime){return`data:${mime||"image/jpeg"};base64,${base64}`;}

// ─── API CALLS ─────────────────────────────────────────────────────────────
async function apiAnalyze(imageBase64,mimeType){
  const r=await fetch("/api/gemini",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action:"analyze",imageBase64,mimeType})
  });
  if(!r.ok){
    let errText="";
    try{errText=await r.text();}catch{}
    return{ok:false,error:"HTTP "+r.status+": "+errText.slice(0,150)};
  }
  try{return await r.json();}
  catch(e){return{ok:false,error:"响应解析失败："+e.message};}
}

// ─── COMPARISON SLIDER ─────────────────────────────────────────────────────
function ComparisonSlider({oldSrc,newSrc,newFilter,onConfirm,onBack,backLabel,confirmLabel,hasNext}){
  const[pos,setPos]=useState(50);
  const[confirmed,setConfirmed]=useState(false);
  const animRef=useRef(false);
  const cRef=useRef();

  const move=useCallback((cx)=>{
    if(animRef.current||confirmed)return;
    const r=cRef.current?.getBoundingClientRect();
    if(!r)return;
    setPos(Math.max(4,Math.min(96,((cx-r.left)/r.width)*100)));
  },[confirmed]);

  const onTM=e=>move(e.touches[0].clientX);
  const onMM=e=>{if(e.buttons===1)move(e.clientX);};

  const confirm=()=>{setConfirmed(true);animRef.current=true;setPos(0);};
  const onTE=()=>{if(animRef.current){animRef.current=false;onConfirm();}};

  return(
    <div ref={cRef} style={{position:"absolute",inset:0,cursor:"col-resize"}}
      onMouseMove={onMM} onTouchMove={onTM}>
      {/* New photo — full bg */}
      <img src={newSrc} style={{position:"absolute",inset:0,
        width:"100%",height:"100%",objectFit:"cover",
        filter:newFilter||undefined}}/>
      {/* Old photo — clipped */}
      <div style={{
        position:"absolute",inset:0,
        clipPath:`inset(0 ${100-pos}% 0 0)`,
        transition:animRef.current?"clip-path .65s cubic-bezier(.4,0,.2,1)":"none",
      }} onTransitionEnd={onTE}>
        <img src={oldSrc} style={{position:"absolute",inset:0,
          width:"100%",height:"100%",objectFit:"cover"}}/>
        {!confirmed&&(
          <div style={{position:"absolute",bottom:160,left:14,
            background:"rgba(0,0,0,.5)",color:"#fff",fontSize:12,
            padding:"4px 10px",borderRadius:8,fontFamily:F}}>修复前</div>
        )}
      </div>
      {/* Divider */}
      {!confirmed&&(
        <div style={{position:"absolute",top:0,bottom:0,left:`${pos}%`,
          width:2,background:P.white,boxShadow:"0 0 10px rgba(0,0,0,.3)",
          transform:"translateX(-50%)",pointerEvents:"none"}}>
          <div style={{position:"absolute",top:"50%",left:"50%",
            transform:"translate(-50%,-50%)",width:44,height:44,borderRadius:"50%",
            background:P.white,boxShadow:"0 2px 12px rgba(0,0,0,.28)",
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:18,color:P.ink,pointerEvents:"all",cursor:"col-resize"}}>⇔</div>
        </div>
      )}
      {!confirmed&&(
        <div style={{position:"absolute",bottom:160,right:14,
          background:P.sage,color:"#fff",fontSize:12,
          padding:"4px 10px",borderRadius:8,fontFamily:F}}>修复后</div>
      )}
      {/* Confirm + Back buttons */}
      {!confirmed&&(
        <div style={{position:"absolute",bottom:60,left:0,right:0,
          padding:"12px 20px 16px",
          background:"linear-gradient(to top,rgba(0,0,0,.72),transparent)"}}>
          <div style={{display:"flex",gap:10}}>
            <button onClick={onBack} style={{
              flex:1,height:54,borderRadius:14,border:"none",
              fontSize:16,fontWeight:500,fontFamily:F,cursor:"pointer",
              background:"rgba(240,227,198,0.15)",
              color:"rgba(240,227,198,0.9)",
            }}>{backLabel||"重新选"}</button>
            <button onClick={confirm} style={{
              flex:2,height:54,borderRadius:14,
              background:P.brown,border:"none",
              color:"#fff",fontSize:16,fontWeight:700,fontFamily:F,cursor:"pointer",
            }}>
              {confirmLabel||(hasNext?"就选这张，继续":"就选这张，完成修复")}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

    <div style={{position:"absolute",inset:0,
      background:`linear-gradient(160deg,#2E1A0E 0%,#1A0D07 45%,#0E0805 100%)`,
      display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center",opacity:.22}}>
        <div style={{fontSize:64,marginBottom:12}}>🌉</div>
        <div style={{color:"#F3EAD8",fontSize:20,fontWeight:600,letterSpacing:2}}>记忆桥梁</div>
      </div>
    </div>
  );
}

// ─── GLOBAL COMPARE OVERLAY ────────────────────────────────────────────────
function GlobalCompare({originSrc,currentSrc,onClose}){
  const[pos,setPos]=useState(50);
  const cRef=useRef();
  const move=cx=>{
    const r=cRef.current?.getBoundingClientRect();
    if(!r)return;
    setPos(Math.max(4,Math.min(96,((cx-r.left)/r.width)*100)));
  };
  return(
    <div ref={cRef} style={{position:"absolute",inset:0,zIndex:100,cursor:"col-resize"}}
      onMouseMove={e=>{if(e.buttons===1)move(e.clientX);}}
      onTouchMove={e=>move(e.touches[0].clientX)}>
      <img src={currentSrc} style={{position:"absolute",inset:0,
        width:"100%",height:"100%",objectFit:"cover"}}/>
      <div style={{position:"absolute",inset:0,
        clipPath:`inset(0 ${100-pos}% 0 0)`}}>
        <img src={originSrc} style={{position:"absolute",inset:0,
          width:"100%",height:"100%",objectFit:"cover"}}/>
        <div style={{position:"absolute",bottom:140,left:14,
          background:"rgba(0,0,0,.5)",color:"#fff",fontSize:12,
          padding:"4px 10px",borderRadius:8}}>原始照片</div>
      </div>
      <div style={{position:"absolute",top:0,bottom:0,left:`${pos}%`,
        width:2,background:P.white,transform:"translateX(-50%)",pointerEvents:"none"}}>
        <div style={{position:"absolute",top:"50%",left:"50%",
          transform:"translate(-50%,-50%)",width:44,height:44,borderRadius:"50%",
          background:P.white,display:"flex",alignItems:"center",justifyContent:"center",
          fontSize:18,pointerEvents:"all",cursor:"col-resize"}}>⇔</div>
      </div>
      <div style={{position:"absolute",bottom:140,right:14,
        background:P.sage,color:"#fff",fontSize:12,
        padding:"4px 10px",borderRadius:8}}>当前修复</div>
      <div style={{position:"absolute",top:0,left:0,right:0,
        padding:"52px 20px 14px",
        background:"linear-gradient(to bottom,rgba(0,0,0,.6),transparent)"}}>
        <div style={{color:"#fff",fontSize:13,textAlign:"center",fontFamily:F}}>
          拖动滑杆对比原图 · 点击任意处返回
        </div>
      </div>
      <div style={{position:"absolute",inset:0}} onClick={onClose}/>
    </div>
  );
}

// ─── MAIN APP ──────────────────────────────────────────────────────────────
function App(){
  // ── State ────────────────────────────────────────────────────────────────
  const[screen,setScreen]=useState(S.HOME);
  const[cam,setCam]=useState(WIDE_CAM);
  const[aiText,setAiText]=useState("");
  const[recSec,setRecSec]=useState(0);
  const[transcript,setTranscript]=useState("");

  // Image state chain
  const[img,setImg]=useState({
    originBase64:null,originMime:"image/jpeg",
    currentBase64:null,prevBase64:null,
    damageCandidateBase64:null,
    candidates:[null,null,null],
    storyContext:"",analysis:null,
  });

  const[selectedOpt,setSelectedOpt]=useState(null);
  const[globalCompare,setGlobalCompare]=useState(false);
  const[error,setError]=useState(null);
  const[isRec,setIsRec]=useState(false);
  const[classResult,setClassResult]=useState(null);

  const recRef=useRef(null);   // {ws, audio} iFlytek WebSocket
  const fileRef=useRef();
  const camRef=useRef();

  // ── Recording timer ───────────────────────────────────────────────────────
  useEffect(()=>{
    if(screen!==S.FACE_REC&&screen!==S.STORY_REC){setRecSec(0);return;}
    const t=setInterval(()=>setRecSec(s=>s+1),1000);
    return()=>clearInterval(t);
  },[screen]);

  // ── Camera helper ─────────────────────────────────────────────────────────
  const moveCam=useCallback((pos)=>setCam(pos||WIDE_CAM),[]);

  // ── iFlytek WebSocket 实时语音识别 ────────────────────────────────────────
  function cleanupAudio(a){
    if(!a)return;
    try{a.processor?.disconnect();a.ctx?.close();a.stream?.getTracks().forEach(t=>t.stop());}catch(_){}
  }

  const startRec=useCallback((onResult)=>{
    // 先请求麦克风权限，拿到 stream 后再连 WebSocket
    navigator.mediaDevices.getUserMedia({audio:true})
      .then(stream=>{
        fetch("/api/xfyun-auth")
          .then(r=>r.json())
          .then(({url,appid,error:e})=>{
            if(!url){
              stream.getTracks().forEach(t=>t.stop());
              setError("讯飞鉴权失败："+(e||"请检查 APPID/APIKey/APISecret"));
              return;
            }

            const ws=new WebSocket(url);
            const audioCtx={ctx:null,processor:null,stream};
            let accumulated="";

            ws.onopen=()=>{
              ws.send(JSON.stringify({
                common:{app_id:appid},
                business:{language:"zh_cn",domain:"iat",accent:"mandarin",
                  vad_eos:30000},  // 30秒静音才结束，老年用户停顿时间长
                data:{status:0,format:"audio/L16;rate=16000",encoding:"raw",audio:""}
              }));

              try{
                const ctx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
                audioCtx.ctx=ctx;
                const src=ctx.createMediaStreamSource(stream);
                const proc=ctx.createScriptProcessor(4096,1,1);
                audioCtx.processor=proc;
                proc.onaudioprocess=ev=>{
                  if(ws.readyState!==WebSocket.OPEN)return;
                  const inp=ev.inputBuffer.getChannelData(0);
                  const pcm=new Int16Array(inp.length);
                  for(let i=0;i<inp.length;i++)pcm[i]=Math.max(-32768,Math.min(32767,inp[i]*32768));
                  const b64=btoa(String.fromCharCode(...new Uint8Array(pcm.buffer)));
                  ws.send(JSON.stringify({data:{status:1,format:"audio/L16;rate=16000",
                    encoding:"raw",audio:b64}}));
                };
                src.connect(proc);proc.connect(ctx.destination);
                setIsRec(true);
              }catch(err){
                setError("音频处理失败："+err.message);
                ws.close();
              }
            };

            ws.onmessage=ev=>{
              const d=JSON.parse(ev.data);
              if(d.code!==0){setError("讯飞识别错误 "+d.code+"："+d.message);return;}
              const result=d.data?.result;
              if(result){
                const words=(result.ws||[]).map(w=>w.cw.map(c=>c.w).join("")).join("");
                if(result.pgs==="rpl"){
                  // 替换模式：用当前片段替换掉之前同位置的内容
                  const rg=result.rg||[0,0];
                  const parts=accumulated.split("|||");
                  parts.splice(rg[0],rg[1]-rg[0]+1,words);
                  accumulated=parts.join("");
                } else {
                  // 追加模式
                  accumulated+=words;
                }
                onResult(accumulated);
              }
              if(d.data?.status===2){cleanupAudio(audioCtx);ws.close();}
            };

            ws.onerror=()=>setError("讯飞 WebSocket 连接失败，请检查网络");
            ws.onclose=()=>{
              cleanupAudio(audioCtx);
              setIsRec(false);
              recRef.current=null;
              // 如果用户没有主动停止（还在录音界面），400ms 后自动重连
              setTimeout(()=>{
                setScreen(cur=>{
                  if(cur===S.FACE_REC||cur===S.STORY_REC){
                    startRec(t=>setTranscript(prev=>prev+t));
                  }
                  return cur;
                });
              },400);
            };
            recRef.current={ws,audio:audioCtx};
          })
          .catch(err=>{
            stream.getTracks().forEach(t=>t.stop());
            setError("讯飞鉴权请求失败："+err.message);
          });
      })
      .catch(()=>setError("麦克风权限被拒绝，请在浏览器地址栏点击锁图标允许麦克风"));
  },[]);

  const stopRec=useCallback(()=>{
    const ref=recRef.current;
    if(!ref)return;
    if(ref.ws?.readyState===WebSocket.OPEN){
      // 发送结束帧，让服务端返回最终识别结果
      ref.ws.send(JSON.stringify({data:{status:2,format:"audio/L16;rate=16000",encoding:"raw",audio:""}}));
    }
    cleanupAudio(ref.audio);
    recRef.current=null;
  },[]);

  // ── File upload handler ───────────────────────────────────────────────────
  const handleFile=useCallback(async(file)=>{
    if(!file)return;
    const mime="image/jpeg"; // 压缩后统一输出 jpeg
    const b64=await compressToBase64(file);
    setImg(s=>({...s,originBase64:b64,originMime:mime,currentBase64:b64,prevBase64:b64}));
    // Start analysis
    setAiText("照片收到了，我来帮您看一看……");
    setScreen(S.ANALYZING);
    moveCam(WIDE_CAM);

    try{
      const res=await apiAnalyze(b64,mime);
      const analysis=res?.result||null;
      setImg(s=>({...s,analysis}));

      if(analysis?.damage?.detected&&analysis.damage.confidence!=="low"){
        moveCam(AREA_CAM[analysis.damage.area]||DEFAULT_DMG_CAM);
        const desc=analysis.damage.description||"一些划痕或折痕";
        setAiText(`我检测到照片上有${desc}，您想先把这些修一修吗？`);
        setScreen(S.DAMAGE_CONFIRM);
      }else if(analysis?.damage?.detected&&analysis.damage.confidence==="low"){
        // Low confidence: let user decide
        moveCam(AREA_CAM[analysis.damage.area]||DEFAULT_DMG_CAM);
        setAiText("照片整体保存还不错，不过似乎有一点轻微的痕迹，您觉得需要先处理一下吗？");
        setScreen(S.DAMAGE_CONFIRM);
      }else{
        goToFaceIntro(analysis);
      }
    }catch(e){
      // Fallback: skip analysis, go to face
      setImg(s=>({...s,analysis:null}));
      goToFaceIntro(null);
    }
  },[moveCam]);

  const goToFaceIntro=useCallback((analysis)=>{
    const faceArea=analysis?.face?.area;
    const faceCam=faceArea?AREA_CAM[faceArea]:DEFAULT_FACE_CAM;
    moveCam(faceCam);
    const count=analysis?.face?.personCount||1;
    const peopleNote=count>=2?"照片里有"+count+"位人物，目前支持最多两人的修复。":"";
    setAiText(`${peopleNote}让我们先从照片中人物的面部开始修复，可以吗？`);
    setScreen(S.FACE_INTRO);
  },[moveCam]);

  // ── Damage skip / confirm ──────────────────────────────────────────────────
  const handleDamageYes=async()=>{
    const dmgArea=img.analysis?.damage?.area;
    moveCam(dmgArea?(AREA_CAM[dmgArea]||DEFAULT_DMG_CAM):DEFAULT_DMG_CAM);
    setAiText("好的，我来帮您把照片上的损伤修一修……请稍等。");
    setScreen(S.DAMAGE_PROCESSING);

    try{
      const instruction="Repair all visible scratches, tears, fold marks, stains, and physical damage in this photograph. Carefully reconstruct any missing or damaged areas to match the surrounding content. Preserve the original subjects, colors, composition, and photographic style exactly as they were.";
      const r=await apiEdit(img.originBase64,img.originMime,instruction);
      if(r?.ok&&r.imageBase64){
        setImg(s=>({...s,damageCandidateBase64:r.imageBase64,prevBase64:s.originBase64}));
        setScreen(S.DAMAGE_COMPARE);
      }else{
        // API 失败，用 CSS filter 模拟修复效果作为降级
        setImg(s=>({...s,damageCandidateBase64:"__filter__",prevBase64:s.originBase64}));
        setScreen(S.DAMAGE_COMPARE);
      }
    }catch(e){
      setError("破损修复失败："+String(e?.message||e));
      goToFaceIntro(img.analysis);
    }
  };

  const handleDamageCompareConfirm=()=>{
    setImg(s=>({
      ...s,
      currentBase64:s.damageCandidateBase64==="__filter__"?s.originBase64:s.damageCandidateBase64,
      damageCandidateBase64:null,
    }));
    goToFaceIntro(img.analysis);
  };

  const handleDamageCompareSkip=()=>{
    setImg(s=>({...s,damageCandidateBase64:null}));
    goToFaceIntro(img.analysis);
  };

  const handleDamageNo=()=>goToFaceIntro(img.analysis);

  // ── Face repair cycle ──────────────────────────────────────────────────────
  const startFaceRec=()=>{
    setTranscript("");
    const faceArea=img.analysis?.face?.area;
    const faceCam=faceArea?AREA_CAM[faceArea]:DEFAULT_FACE_CAM;
    moveCam(faceCam);
    setAiText("您觉得人物的面部，还有什么想改的呢？");
    setScreen(S.FACE_REC);
    startRec(t=>setTranscript(t));
  };

  const stopFaceRec=async()=>{
    stopRec();
    const finalText=transcript.trim();
    if(!finalText){
      setAiText("好像没有收到您说的内容，可以再说一次吗？");
      return;
    }
    setAiText("我听到了，稍等一下……");
    setScreen(S.FACE_THINKING);

    try{
      const res=await apiClassify(finalText,img.storyContext,"face");
      // 显示真实错误，方便排查
      if(!res?.ok){
        const errMsg=typeof res?.error==="string"
          ? res.error
          : JSON.stringify(res?.error||res?.raw||res||"API返回异常");
        setError("混元错误："+errMsg.substring(0,120));
        setScreen(S.FACE_INTRO);
        return;
      }
      const result=res?.result;
      if(!result){
        setError("返回格式异常："+JSON.stringify(res).substring(0,120));
        setScreen(S.FACE_INTRO);
        return;
      }
      setClassResult(result);

      if(result.attribute_status==="unsupported"){
        setAiText("这个我暂时还做不到——"+(result.unsupported_reason||"超出了当前修复范围")+"，要换一个方向说说吗？");
        setScreen(S.FACE_CONFIRM);
      }else{
        setAiText(result.confirmation_phrase||"我理解了，是这个意思吗？");
        setScreen(S.FACE_CONFIRM);
      }
    }catch(e){
      setError("请求失败："+String(e?.message||e));
      setScreen(S.FACE_INTRO);
    }
  };

  const handleFaceConfirmYes=async()=>{
    if(classResult?.attribute_status==="unsupported"){
      startFaceRec();
      return;
    }
    const variants=(classResult?.variants?.length>0)
      ? classResult.variants
      : [
        "轻度修复面部细节，保留人物自然神韵，整体风格不变",
        "明显提升面部清晰度和亮度，让人物面貌更鲜明",
        "温和修复面部，保留老照片的年代质感和整体氛围",
      ];
    setSelectedOpt(null);
    setAiText("正在为您生成三种修复效果……每张大约需要10-20秒，请耐心等待。");
    setScreen(S.FACE_GENERATING);

    // CSS filter 降级方案（图像API不可用时使用）
    const FALLBACK_FILTERS=[
      "sepia(0.08) contrast(1.06) brightness(1.12) saturate(1.15)",
      "sepia(0) contrast(1.22) brightness(1.28) saturate(1.2)",
      "sepia(0.42) contrast(1.02) brightness(0.96) saturate(0.9)",
    ];

    try{
      const results=[];
      let usedFallback=false;

      for(let i=0;i<variants.length;i++){
        setAiText(i===0?"正在生成第 1/3 种效果……":`正在生成第 ${i+1}/3 种效果……`);
        const r=await apiEdit(img.currentBase64,img.originMime,variants[i]);

        if(r?.ok&&r.imageBase64){
          results.push({type:"base64",data:r.imageBase64});
        } else {
          // API 失败，标记使用降级
          usedFallback=true;
          results.push({type:"filter",data:FALLBACK_FILTERS[i]});
        }
      }

      setImg(s=>({...s,candidates:results}));
      if(usedFallback){
        setAiText("好了，这是三种修复方向的预览效果，您看哪个最接近您心里想的？");
      } else {
        setAiText("好了，这是三种不同的修复方向，您看哪个最接近您心里想的？");
      }
      setScreen(S.FACE_OPTIONS);
    }catch(e){
      // 完全失败时也用降级
      const fallbacks=FALLBACK_FILTERS.map(f=>({type:"filter",data:f}));
      setImg(s=>({...s,candidates:fallbacks}));
      setAiText("好了，这是三种修复方向的预览效果，您看哪个最接近您心里想的？");
      setScreen(S.FACE_OPTIONS);
    }
  };

  const handleFaceConfirmNo=()=>{
    setClassResult(null);
    startFaceRec();
  };

  const handleSelectOpt=i=>setSelectedOpt(i);

  const handleBackToOptions=()=>{
    setSelectedOpt(null);
    setAiText("好了，三种修复效果，您再选一个看看？");
    setScreen(S.FACE_OPTIONS);
  };

  const handleGoCompare=()=>{
    setImg(s=>({...s,prevBase64:s.currentBase64}));
    setScreen(S.FACE_COMPARE);
  };

  const handleSliderConfirm=()=>{
    const chosen=img.candidates[selectedOpt];
    // base64: 更新 currentBase64；filter: 只更新 currentFilter 记录
    const newBase64=chosen?.type==="base64"?chosen.data:img.currentBase64;
    setImg(s=>({...s,currentBase64:newBase64,candidates:[null,null,null]}));
    setSelectedOpt(null);
    setClassResult(null);
    moveCam(AREA_CAM[img.analysis?.face?.area]||DEFAULT_FACE_CAM);
    setAiText("这个效果保存好了。面部还有什么想继续调整的吗？");
    setScreen(S.FACE_NEXT_ASK);
  };

  const handleFaceMoreYes=()=>startFaceRec();

  const handleFaceDone=()=>{
    moveCam(WIDE_CAM);
    setAiText("面部修复完成了。接下来，您想不想改改照片的色调和颜色？");
    setScreen(S.COLOR_TEASER);
  };

  // ── Story ──────────────────────────────────────────────────────────────────
  const handleStoryYes=()=>{
    // 和"直接跳过"一样，先把照片加载为底图
    const f=handleFile._file;
    if(f){
      const mime=f.type||"image/jpeg";
      fileToBase64(f).then(b64=>{
        setImg(s=>({...s,originBase64:b64,originMime:mime,currentBase64:b64,prevBase64:b64}));
      });
    }
    setTranscript("");
    setAiText("好的，您慢慢说，讲讲这张照片的故事……");
    setScreen(S.STORY_REC);
    startRec(t=>setTranscript(t));
  };

  const handleStoryStop=()=>{
    stopRec();
    setImg(s=>({...s,storyContext:transcript}));
    handleFile._fromStory=true;
    // Already have file — just proceed to analyze
    setAiText("谢谢您分享这段回忆。让我来分析一下照片……");
    setScreen(S.ANALYZING);
    apiAnalyze(img.originBase64,img.originMime).then(res=>{
      const analysis=res?.result||null;
      setImg(s=>({...s,analysis}));
      if(analysis?.damage?.detected){
        const desc=analysis.damage.description||"一些损伤";
        moveCam(AREA_CAM[analysis.damage.area]||DEFAULT_DMG_CAM);
        setAiText(`我看到照片上有${desc}，您想先修复这些吗？`);
        setScreen(S.DAMAGE_CONFIRM);
      }else{
        goToFaceIntro(analysis);
      }
    }).catch(()=>goToFaceIntro(null));
  };

  const handleStorySkip=()=>{
    setImg(s=>({...s,storyContext:""}));
    setAiText("好的，我们开始分析照片……");
    setScreen(S.ANALYZING);
    apiAnalyze(img.originBase64,img.originMime).then(res=>{
      const analysis=res?.result||null;
      setImg(s=>({...s,analysis}));
      if(analysis?.damage?.detected){
        moveCam(AREA_CAM[analysis.damage.area]||DEFAULT_DMG_CAM);
        setAiText("检测到照片有些损伤，您想先修复吗？");
        setScreen(S.DAMAGE_CONFIRM);
      }else goToFaceIntro(analysis);
    }).catch(()=>goToFaceIntro(null));
  };

  // ── Computed ────────────────────────────────────────────────────────────────
  const showPhoto=![S.HOME].includes(screen);
  const preUpload=[S.PHOTO_INTRO,S.UPLOAD_CHOICE,S.UPLOAD_METHOD].includes(screen);
  const photoSrc=img.currentBase64?imgSrc(img.currentBase64,img.originMime):null;
  const originSrc=img.originBase64?imgSrc(img.originBase64,img.originMime):null;
  const drawerH=DH[screen]||0;

  if(screen===S.HOME)return <HomePage onEnter={()=>{setAiText("欢迎使用AI引导转译助手，您有想要修复的老照片吗？");setScreen(S.PHOTO_INTRO);}}/>;

  return(
    <div style={{width:"min(390px,100vw)",height:"100dvh",position:"relative",overflow:"hidden",background:P.bg,margin:"0 auto"}}>

      {/* ── HIDDEN FILE INPUTS ── */}
      <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}}
        onChange={e=>{const f=e.target.files[0];if(f){setScreen(S.STORY_ASK);setAiText("照片收到了！\n您想不想先讲一讲这张照片背后的故事？这会帮助我更好地理解您的想法。");handleFile._file=f;}}}/>
      <input ref={camRef} type="file" accept="image/*" capture="environment" style={{display:"none"}}
        onChange={e=>{const f=e.target.files[0];if(f){setScreen(S.STORY_ASK);setAiText("照片收到了！\n您想不想先讲一讲这张照片背后的故事？这会帮助我更好地理解您的想法。");handleFile._file=f;}}}/>

      {/* ── LAYER 1: PHOTO CANVAS ── */}
      {showPhoto&&(
        preUpload?(
          <PreUploadBg/>
        ):(
          <div style={{position:"absolute",inset:0,overflow:"hidden"}}>
            <div style={{
              position:"absolute",inset:0,
              transition:"transform .72s cubic-bezier(.4,0,.2,1)",
              transform:`scale(${cam.scale})`,
              transformOrigin:`${cam.ox}% ${cam.oy}%`,
            }}>
              {photoSrc&&(
                <img src={photoSrc} alt="照片" style={{
                  width:"100%",height:"100%",objectFit:"cover"}}/>
              )}
              {/* Vignette */}
              <div style={{position:"absolute",inset:0,
                background:"radial-gradient(ellipse at center,transparent 38%,rgba(15,8,3,.5) 100%)",
                pointerEvents:"none"}}/>
            </div>
            {/* Scanning animation during analysis */}
            {screen===S.ANALYZING&&(
              <div style={{position:"absolute",left:0,right:0,height:2,
                background:`linear-gradient(to right,transparent,${P.sageLt},transparent)`,
                animation:"scanln 2.2s ease-in-out infinite"}}/>
            )}
            {/* 破损修复对比滑杆 */}
            {screen===S.DAMAGE_COMPARE&&img.prevBase64&&(
              <ComparisonSlider
                oldSrc={imgSrc(img.prevBase64,img.originMime)}
                newSrc={img.damageCandidateBase64==="__filter__"
                  ? imgSrc(img.originBase64,img.originMime)
                  : imgSrc(img.damageCandidateBase64,img.originMime)}
                newFilter={img.damageCandidateBase64==="__filter__"
                  ? "contrast(1.08) brightness(1.06) saturate(1.05)"
                  : undefined}
                onConfirm={handleDamageCompareConfirm}
                onBack={handleDamageCompareSkip}
                backLabel="跳过修补"
                confirmLabel="修复效果好，继续"
                hasNext={true}
              />
            )}

            {/* 面部修复对比滑杆 */}
            {screen===S.FACE_COMPARE&&img.prevBase64&&img.candidates[selectedOpt]&&(()=>{
              const c=img.candidates[selectedOpt];
              const newSrc=c?.type==="base64"
                ? imgSrc(c.data,img.originMime)
                : imgSrc(img.currentBase64,img.originMime);
              const newFilter=c?.type==="filter"?c.data:undefined;
              return(
                <ComparisonSlider
                  oldSrc={imgSrc(img.prevBase64,img.originMime)}
                  newSrc={newSrc}
                  newFilter={newFilter}
                  onConfirm={handleSliderConfirm}
                  onBack={handleBackToOptions}
                  hasNext={false}
                />
              );
            })()}
            {/* Global compare */}
            {globalCompare&&originSrc&&photoSrc&&(
              <GlobalCompare originSrc={originSrc} currentSrc={photoSrc}
                onClose={()=>setGlobalCompare(false)}/>
            )}
          </div>
        )
      )}

      {/* ── LAYER 2: DRAWER ── */}
      {screen!==S.FACE_COMPARE&&(
        <Drawer height={drawerH}>

          {/* PHOTO_INTRO */}
          {screen===S.PHOTO_INTRO&&(
            <>
              <AiBubble text={aiText}/>
              <div style={{marginTop:"auto",display:"flex",flexDirection:"column",gap:10}}>
                <Btn label="📷 修复新照片" onClick={()=>setScreen(S.UPLOAD_CHOICE)} primary full/>
                <Btn label="📂 查看修复记录" disabled full/>
              </div>
            </>
          )}

          {/* UPLOAD_CHOICE */}
          {screen===S.UPLOAD_CHOICE&&(
            <>
              <div style={{color:P.brown,fontSize:14,fontWeight:600,
                marginBottom:14,fontFamily:F}}>选择待修复的照片</div>
              <Btn label="📸 修复新照片" onClick={()=>setScreen(S.UPLOAD_METHOD)} primary full
                style={{marginBottom:10,height:52}}/>
              <Btn label="📂 查看修复记录" disabled full style={{height:52}}/>
            </>
          )}

          {/* UPLOAD_METHOD */}
          {screen===S.UPLOAD_METHOD&&(
            <>
              <div style={{color:P.brown,fontSize:14,fontWeight:600,
                marginBottom:14,fontFamily:F}}>选择新照片</div>
              <Btn label="🖼 从手机相册上传" onClick={()=>fileRef.current?.click()} primary full
                style={{marginBottom:10,height:52}}/>
              <Btn label="📷 打开相机拍摄" onClick={()=>camRef.current?.click()} full
                style={{height:52}}/>
            </>
          )}

          {/* STORY_ASK */}
          {screen===S.STORY_ASK&&(
            <>
              <AiBubble text={aiText}/>
              <div style={{marginTop:"auto",display:"flex",gap:10}}>
                <Btn label="我来讲一讲" onClick={handleStoryYes} primary/>
                <Btn label="直接开始修图" onClick={()=>{
                  const f=handleFile._file;
                  if(f)handleFile(f);
                  else handleStorySkip();
                }}/>
              </div>
            </>
          )}

          {/* STORY_REC */}
          {screen===S.STORY_REC&&(
            <>
              <div style={{color:P.dust,fontSize:14,textAlign:"center",
                marginBottom:8,fontFamily:F,lineHeight:1.5}}>{aiText}</div>
              <Waveform color={P.brown}/>
              {transcript&&(
                <div style={{margin:"8px 0",padding:"8px 12px",
                  background:P.brownGhost,borderRadius:10,
                  color:P.ink,fontSize:14,lineHeight:1.6,fontFamily:F,
                  maxHeight:80,overflow:"hidden"}}>
                  {transcript}
                </div>
              )}
              <div style={{color:P.muted,fontSize:13,textAlign:"center",marginBottom:8,fontFamily:F,
                fontVariantNumeric:"tabular-nums"}}>
                {String(Math.floor(recSec/60)).padStart(2,"0")}:{String(recSec%60).padStart(2,"0")}
              </div>
              <div style={{marginTop:"auto",display:"flex",gap:10}}>
                <Btn label="说完了" onClick={handleStoryStop} primary/>
                <Btn label="跳过故事" onClick={()=>{stopRec();handleStorySkip();}}/>
              </div>
            </>
          )}

          {/* ANALYZING */}
          {screen===S.ANALYZING&&(
            <>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
                <Spinner/>
                <div style={{color:P.ink,fontSize:16,fontFamily:F,lineHeight:1.65}}>{aiText}</div>
              </div>
              <div style={{color:P.muted,fontSize:13,fontFamily:F,lineHeight:1.65}}>
                原照片始终保留，每个版本都会自动存档。
              </div>
            </>
          )}

          {/* DAMAGE_CONFIRM */}
          {screen===S.DAMAGE_CONFIRM&&(
            <>
              <AiBubble text={aiText}/>
              <div style={{marginTop:"auto",display:"flex",gap:10}}>
                <Btn label="好的，先修损伤" onClick={handleDamageYes} primary/>
                <Btn label="直接修人物" onClick={handleDamageNo}/>
              </div>
            </>
          )}

          {/* DAMAGE_PROCESSING */}
          {screen===S.DAMAGE_PROCESSING&&(
            <>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
                <Spinner/>
                <div style={{color:P.ink,fontSize:15,fontFamily:F,lineHeight:1.65,flex:1}}>{aiText}</div>
              </div>
              <div style={{color:P.muted,fontSize:13,fontFamily:F,lineHeight:1.65,animation:"pulse 2s infinite"}}>
                正在分析损伤区域并生成修复方案，请稍等……
              </div>
            </>
          )}

          {/* DAMAGE_PLACEHOLDER */}
          {screen===S.DAMAGE_PLACEHOLDER&&(
            <>
              <div style={{display:"flex",gap:10,alignItems:"flex-start",
                padding:"12px 14px",background:"rgba(122,86,64,.08)",
                borderRadius:14,border:`1px solid ${P.brownBorder}`,marginBottom:14}}>
                <div style={{fontSize:20,flexShrink:0}}>🔧</div>
                <div>
                  <div style={{color:P.brown,fontSize:14,fontWeight:700,
                    fontFamily:F,marginBottom:4}}>破损修补功能开发中</div>
                  <div style={{color:P.dust,fontSize:13,fontFamily:F,lineHeight:1.6}}>
                    AI 已定位到照片上的破损区域。修补功能正在开发，我们先进入面部修复环节吧。
                  </div>
                </div>
              </div>
              <div style={{color:P.muted,fontSize:12,fontFamily:F,
                lineHeight:1.65,marginBottom:"auto"}}>
                📌 原始照片始终保留，修补完成后可随时补做这一步。
              </div>
              <Btn label="好的，先去修复面部" onClick={()=>goToFaceIntro(img.analysis)} primary full/>
            </>
          )}

          {/* FACE_INTRO */}
          {screen===S.FACE_INTRO&&(
            <>
              <AiBubble text={aiText}/>
              <div style={{marginTop:"auto",display:"flex",gap:10}}>
                <Btn label="好的，开始吧" onClick={startFaceRec} primary/>
                <Btn label="跳过这步" onClick={handleFaceDone}/>
              </div>
            </>
          )}

          {/* FACE_REC */}
          {screen===S.FACE_REC&&(
            <>
              <div style={{color:P.dust,fontSize:14,textAlign:"center",
                marginBottom:8,fontFamily:F,lineHeight:1.5}}>{aiText}</div>
              <Waveform/>
              {transcript&&(
                <div style={{margin:"6px 0",padding:"8px 12px",
                  background:P.brownGhost,borderRadius:10,
                  color:P.ink,fontSize:14,lineHeight:1.6,fontFamily:F,
                  maxHeight:72,overflow:"hidden"}}>
                  {transcript}
                </div>
              )}
              <div style={{color:P.muted,fontSize:13,textAlign:"center",
                marginBottom:6,fontFamily:F,fontVariantNumeric:"tabular-nums",
                display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                <span style={{color:P.rec,fontSize:11}}>● 正在录音</span>
                {String(Math.floor(recSec/60)).padStart(2,"0")}:{String(recSec%60).padStart(2,"0")}
              </div>
              <div style={{marginTop:"auto"}}>
                <Btn label="我说完了" onClick={stopFaceRec} danger full/>
              </div>
            </>
          )}

          {/* FACE_THINKING */}
          {screen===S.FACE_THINKING&&(
            <>
              <AiBubble text={aiText}/>
              <div style={{marginTop:14}}><Dots/></div>
            </>
          )}

          {/* FACE_CONFIRM */}
          {screen===S.FACE_CONFIRM&&(
            <>
              <AiBubble text={aiText}/>
              <div style={{marginTop:"auto",display:"flex",gap:10}}>
                {classResult?.attribute_status==="unsupported"?(
                  <Btn label="好的，换个方向说" onClick={handleFaceConfirmYes} primary full/>
                ):(
                  <>
                    <Btn label="重新说" onClick={handleFaceConfirmNo}/>
                    <Btn label="对的，就是这个意思" onClick={handleFaceConfirmYes} primary style={{flex:2}}/>
                  </>
                )}
              </div>
            </>
          )}

          {/* FACE_GENERATING */}
          {screen===S.FACE_GENERATING&&(
            <>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
                <Spinner/>
                <div style={{color:P.ink,fontSize:15,fontFamily:F,lineHeight:1.65,flex:1}}>{aiText}</div>
              </div>
              <div style={{color:P.muted,fontSize:13,fontFamily:F,lineHeight:1.65,animation:"pulse 2s infinite"}}>
                三种修复效果同步生成中，这需要一点时间……
              </div>
            </>
          )}

          {/* FACE_OPTIONS */}
          {screen===S.FACE_OPTIONS&&(
            <>
              <AiBubble text={aiText} small/>
              <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:10,flex:1,overflow:"auto"}}>
                {img.candidates.map((c,i)=>{
                  const labels=classResult?.intents?.length>0
                    ?["方案一","方案二","方案三"]
                    :["自然修复","明亮清晰","保留年代感"];
                  const isFilter=c?.type==="filter";
                  const isBase64=c?.type==="base64";
                  return(
                    <div key={i} onClick={()=>handleSelectOpt(i)} style={{
                      display:"flex",gap:12,alignItems:"center",
                      background:selectedOpt===i?"rgba(113,137,104,.14)":P.brownGhost,
                      border:`1.5px solid ${selectedOpt===i?P.sage:P.brownBorder}`,
                      borderRadius:14,padding:"10px 12px",cursor:"pointer",
                      transition:"all .18s",
                    }}>
                      <div style={{width:64,height:64,borderRadius:9,overflow:"hidden",flexShrink:0,
                        background:"rgba(122,86,64,.1)",display:"flex",alignItems:"center",justifyContent:"center"}}>
                        {isBase64?(
                          <img src={imgSrc(c.data,img.originMime)}
                            style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                        ):isFilter&&img.currentBase64?(
                          <img src={imgSrc(img.currentBase64,img.originMime)}
                            style={{width:"100%",height:"100%",objectFit:"cover",filter:c.data}}/>
                        ):(
                          <Spinner size={22}/>
                        )}
                      </div>
                      <div style={{flex:1}}>
                        <div style={{color:P.ink,fontSize:16,fontWeight:700,fontFamily:F}}>{labels[i]}</div>
                        <div style={{color:P.dust,fontSize:13,marginTop:2,fontFamily:F}}>
                          {i===0?"轻度还原，保留神韵":i===1?"强化细节，整体明亮":"修复损伤，留年代感"}
                        </div>
                      </div>
                      {selectedOpt===i&&<div style={{color:P.sage,fontSize:20}}>✓</div>}
                    </div>
                  );
                })}
              </div>
              {selectedOpt!==null&&(
                <div style={{marginTop:10}}>
                  <Btn label="用这张对比一下" onClick={handleGoCompare} primary full/>
                </div>
              )}
            </>
          )}

          {/* FACE_NEXT_ASK */}
          {screen===S.FACE_NEXT_ASK&&(
            <>
              <AiBubble text={aiText}/>
              <div style={{marginTop:"auto",display:"flex",gap:10}}>
                <Btn label="还想改改" onClick={handleFaceMoreYes} primary/>
                <Btn label="面部修完了" onClick={handleFaceDone}/>
              </div>
            </>
          )}

          {/* COLOR_TEASER */}
          {screen===S.COLOR_TEASER&&(
            <>
              <AiBubble text={aiText}/>
              <div style={{marginTop:10,padding:"10px 12px",
                background:P.brownGhost,borderRadius:12,
                color:P.muted,fontSize:13,fontFamily:F,lineHeight:1.6}}>
                💡 色彩调整、背景修复等功能正在开发中，敬请期待。
              </div>
              <div style={{marginTop:"auto",display:"flex",gap:10}}>
                <Btn label="保存当前成果" onClick={()=>{}} primary/>
                <Btn label="返回首页" onClick={()=>{setScreen(S.HOME);setImg({originBase64:null,originMime:"image/jpeg",currentBase64:null,prevBase64:null,candidates:[null,null,null],storyContext:"",analysis:null});}}/>
              </div>
            </>
          )}

        </Drawer>
      )}

      {/* ── LAYER 3: BOTTOM BAR ── */}
      <BottomBar
        state={screen}
        onGlobalCompare={()=>{if(photoSrc&&originSrc)setGlobalCompare(true);}}
        onUndo={()=>{
          const prev={
            [S.STORY_REC]:S.STORY_ASK,[S.ANALYZING]:S.STORY_ASK,
            [S.DAMAGE_CONFIRM]:S.STORY_ASK,[S.DAMAGE_PLACEHOLDER]:S.DAMAGE_CONFIRM,
            [S.DAMAGE_PROCESSING]:S.DAMAGE_CONFIRM,[S.DAMAGE_COMPARE]:S.DAMAGE_CONFIRM,
            [S.FACE_INTRO]:S.DAMAGE_CONFIRM,[S.FACE_REC]:S.FACE_INTRO,
            [S.FACE_THINKING]:S.FACE_REC,[S.FACE_CONFIRM]:S.FACE_REC,
            [S.FACE_GENERATING]:S.FACE_CONFIRM,[S.FACE_OPTIONS]:S.FACE_CONFIRM,
            [S.FACE_COMPARE]:S.FACE_OPTIONS,[S.FACE_NEXT_ASK]:S.FACE_COMPARE,
            [S.COLOR_TEASER]:S.FACE_NEXT_ASK,
          };
          if(prev[screen])setScreen(prev[screen]);
        }}
      />

      {/* ── ERROR TOAST ── */}
      {error&&(
        <div style={{position:"absolute",top:52,left:16,right:16,
          background:"rgba(194,65,40,.95)",color:"#fff",
          borderRadius:12,padding:"12px 16px",
          display:"flex",justifyContent:"space-between",alignItems:"center",
          boxShadow:"0 4px 20px rgba(0,0,0,.3)",zIndex:200,fontFamily:F,fontSize:14}}>
          <span>{error}</span>
          <button onClick={()=>setError(null)} style={{
            background:"none",border:"none",color:"#fff",fontSize:18,cursor:"pointer",
            marginLeft:12,lineHeight:1}}>✕</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
